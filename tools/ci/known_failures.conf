# known_failures.conf - Single source of truth for interop known failures.
# Sourced by run_interop.sh and check_known_failures.sh.
#
# KNOWN_FAILURES: array of "direction:name" entries for unconditional failures.
# is_known_failure_from_conf(): protocol-specific and conditional failure rules.
# DASHBOARD_ENTRIES: array of "direction:name|description|test_method" for the
#   tracking dashboard in check_known_failures.sh.
#
# Categories:
#   1. Upstream batch bug: upstream can't read its own compressed delta batches
#   2. Proto < 30: features that upstream hard-rejects at older protocol versions
#   3. Proto < 29: upstream sender refuses multi-char filter prefixes
#      (exclude.c:1530 legal_len=1 + send_rules:1623-1627 RERR_PROTOCOL)
#   4. oc-rsync gaps: known implementation gaps tracked for future fix

# Unconditional known failures (direction:name).
# Empty: every current entry is scoped by protocol or upstream version below.
# A blanket entry can never report UNEXPECTED FAIL, so it hides the day the
# limitation is fixed. Prefer a scoped rule in is_known_failure_from_conf().
KNOWN_FAILURES=()

# Newest upstream release still carrying the compressed-batch self-roundtrip
# bug. Verified failing on 3.4.4 (the newest release) on both Linux/x86_64 and
# macOS/arm64, so the defect is version-scoped, not platform-scoped. Bump this
# only after re-verifying against the newer release; leaving it behind makes
# the standalone test report UNEXPECTED FAIL once a fixed upstream enters the
# matrix, which is the point.
UPSTREAM_BATCH_SELF_ROUNDTRIP_FIXED_AFTER="3.4.4"

# Newest upstream release that refuses a protocol-32 batch header outright.
# Upstream stamps the negotiated protocol into the batch header and rejects
# anything newer than its own (compat.c:163/167, "The protocol version in the
# batch file is too new"). Verified with banner-checked binaries: a batch
# written by upstream 3.4.4 itself fails identically on 3.0.9 (32 > 30) and
# 3.1.3 (32 > 31), so this is an upstream cross-version limitation, not an
# oc-rsync divergence. Any newer upstream entering the matrix is not
# suppressed by this bound.
UPSTREAM_BATCH_PROTO32_UNREADABLE_UP_TO="3.1.3"

# Set by is_known_failure_from_conf() for batch legs so the caller can report
# which of the two causes applies to the upstream version at hand.
BATCH_KNOWN_FAILURE_REASON=""

# Returns 0 when dotted version $1 is <= dotted version $2.
version_le() {
  [[ "$1" == "$2" ]] && return 0
  [[ "$(printf '%s\n%s\n' "$1" "$2" \
        | sort -t. -k1,1n -k2,2n -k3,3n | head -n1)" == "$1" ]]
}

# Protocol-specific and conditional known failure rules.
# Returns 0 if the given test is a known failure, 1 otherwise.
# Arguments: direction name forced_proto [upstream_version]
is_known_failure_from_conf() {
  local direction=$1 name=$2 forced_proto=$3 upstream_version=${4:-}
  local key="${direction}:${name}"

  # Check unconditional failures
  if (( ${#KNOWN_FAILURES[@]} > 0 )); then
    for kf in "${KNOWN_FAILURES[@]}"; do
      [[ "$kf" == "$key" ]] && return 0
    done
  fi

  # UPSTREAM BUG: upstream rsync cannot read back its own compressed delta
  # batch files. Verified against a genuine 3.4.4 (banner-checked, not path-
  # checked): upstream --write-batch -z --compress-choice=zlib produces a
  # batch, then upstream --read-batch fails with "inflate returned -3"
  # (exit 12) and leaves the destination unchanged.
  #
  # Root cause: the batch writer in token.c tees raw DEFLATED_DATA tokens
  # (zlib-compressed) to the batch fd, but the batch reader's inflate context
  # lacks the dictionary synchronization that see_deflate_token() provides
  # during live transfers. This causes inflate failure on any delta batch
  # with block matches (copy tokens).
  #
  # oc-rsync reads these batch files correctly by implementing proper
  # CPRES_ZLIB dictionary sync in its batch reader.
  #
  # upstream: token.c:608 - inflate fails without dictionary sync
  # upstream: compat.c:194-195 - batch read always assumes CPRES_ZLIB
  #
  # Scoped to the affected releases. An unknown version is NOT suppressed:
  # the caller could not identify the peer, so the result must be reported.
  if [[ "$direction" == "standalone" \
        && "$name" == "upstream-compressed-batch-self-roundtrip" ]]; then
    [[ -n "$upstream_version" ]] || return 1
    version_le "$upstream_version" \
      "$UPSTREAM_BATCH_SELF_ROUNDTRIP_FIXED_AFTER" && return 0
    return 1
  fi

  # BATCH MODE cross-tool leg (tests/batch_interop_test.sh).
  # "oc-to-upstream" = oc-rsync --write-batch, upstream --read-batch.
  # Two independent causes, split by upstream version. An unknown version is
  # not suppressed: the caller could not identify the peer, so the result must
  # be reported.
  if [[ "$direction" == "batch" && "$name" == "oc-to-upstream" ]]; then
    [[ -n "$upstream_version" ]] || return 1
    if version_le "$upstream_version" \
         "$UPSTREAM_BATCH_PROTO32_UNREADABLE_UP_TO"; then
      BATCH_KNOWN_FAILURE_REASON="upstream <= ${UPSTREAM_BATCH_PROTO32_UNREADABLE_UP_TO} rejects a protocol-32 batch header (compat.c:163/167)"
    else
      # oc-rsync gap: oc records a whole-file-shaped sum_head (count=0,
      # blength=0, s2length=16) for a delta batch, so upstream's receiver
      # aborts with "Invalid block index 0 (count=0)" (receiver.c:417) or
      # crashes. Deliberately not version-bounded - the batch harness reports
      # an unexpected PASS as a failure, which is what forces this entry to be
      # deleted the day the bug is fixed instead of silently outliving it.
      BATCH_KNOWN_FAILURE_REASON="oc-rsync gap, issue #6978: delta batch body is not upstream's wire format"
    fi
    return 0
  fi

  # oc-rsync RECEIVER over the wire (daemon/remote) drops named-user POSIX ACL
  # entries and the ACL mask, keeping only the base user/group/other. The
  # oc-rsync LOCAL copy path and the oc-rsync SENDER path both preserve them
  # (verified: oc client -avA -> upstream daemon round-trips the named-user
  # ACL + mask exactly), so the divergence is specific to applying an ACL
  # decoded from the wire on the receiving side. Only the "up" direction
  # (upstream client -> oc daemon, oc = receiver) is affected; the "oc"
  # direction (oc client -> upstream daemon, oc = sender) passes and is left
  # ungated so it keeps verifying oc's ACL sender interop. Tracked as an
  # oc-rsync receiver-side ACL gap; xattrs are unaffected.
  if [[ "$direction" == "up" && "$name" == "acls" ]]; then
    return 0
  fi

  # PROTOCOL < 30 KNOWN FAILURES (up direction only)
  # These are all upstream rsync limitations - upstream itself fails identically
  # when negotiating these features at protocol versions below 30. The protocol
  # version is forced in CI to test backward compatibility with older rsync
  # versions (e.g., rsync 3.0.9 speaks protocol 28, rsync 3.1.3 speaks 30+).
  # NOT FIXABLE: upstream hardcodes these version checks in compat.c.
  if [[ "$direction" == "up" && -n "$forced_proto" && "$forced_proto" -le 29 ]]; then
    case "$name" in
      # ACLs: upstream compat.c:655-661 setup_protocol() hard-exits with
      # RERR_PROTOCOL if --acls is used at protocol < 30. The ACL wire format
      # (flist ACL encoding fields) was introduced in protocol 30 - older
      # protocols have no way to encode ACL data on the wire.
      # Verified: upstream rsync -A at --protocol=29 exits with code 2.
      acls) return 0 ;;

      # Xattrs: upstream compat.c:662-668 setup_protocol() hard-exits with
      # RERR_PROTOCOL if --xattrs is used at protocol < 30. Same reason as
      # ACLs - xattr wire format fields were added in protocol 30.
      # Verified: upstream rsync -X at --protocol=29 exits with code 2.
      xattrs) return 0 ;;

      # Compression algorithm selection: upstream compat.c:556-564
      # negotiate_the_strings() + compat.c:729-742. The 'v' compat flag
      # enables vstring negotiation, which is how compression algorithm
      # choice (zstd, lz4) is communicated. This flag requires protocol >= 30.
      # At protocol < 30, upstream falls back to hardcoded "zlib"
      # (strlcpy(tmpbuf, "zlib", MAX_NSTR_STRLEN) at compat.c:383).
      # zstd and lz4 simply cannot be selected without vstring negotiation.
      # Verified: upstream rsync --compress-choice=zstd at --protocol=29
      # silently falls back to zlib, causing codec mismatch.
      compress-zstd|compress-lz4) return 0 ;;


    esac
  fi

  # PROTOCOL < 29 KNOWN FAILURES (up direction only)
  # UPSTREAM RSYNC LIMITATIONS, not oc-rsync bugs.
  # NOT FIXABLE: upstream hardcodes legal_len=1 at proto < 29.
  if [[ "$direction" == "up" && -n "$forced_proto" && "$forced_proto" -le 28 ]]; then
    case "$name" in
      # Merge-filter: upstream exclude.c:1530 legal_len=1 +
      # send_rules:1623-1627 RERR_PROTOCOL (no bytes reach oc-rsync;
      # upstream limitation). When forced to --protocol=28, upstream's
      # sender refuses dir-merge ':' rules: get_rule_prefix() at
      # exclude.c:1530 sets legal_len=1 (only "+ "/"- " allowed) and
      # send_rules() at exclude.c:1623-1627 exits RERR_PROTOCOL with
      # "filter rules are too modern for remote rsync" before any bytes
      # leave the upstream client. oc-rsync's serializer
      # (crates/protocol/src/filters/prefix.rs build_old_prefix and
      # crates/protocol/src/filters/wire.rs serialize_rule) already
      # mirrors the same legal_len=1 semantics.
      # Verified: upstream rsync --filter='dir-merge ...' at
      # --protocol=28 exits RERR_PROTOCOL with the "too modern" message.
      merge-filter) return 0 ;;
    esac
  fi

  return 1
}

# Dashboard entries for check_known_failures.sh.
# Format: direction:name|description|test_method
# test_method: "daemon" for scenario-based, "standalone" for standalone tests.
# Keep in sync with actual known failure rules above.
# batch:oc-to-upstream is intentionally absent: check_known_failures.sh has no
# driver for batch legs, so a row here would report SKIPPED forever.
# tests/batch_interop_test.sh runs and reports that leg itself.
DASHBOARD_ENTRIES=(
  # --- Upstream batch bug (scoped to upstream <= 3.4.4) ---
  # upstream rsync can't read its own compressed delta batch files
  "standalone:upstream-compressed-batch-self-roundtrip|upstream compressed batch self-roundtrip, upstream <= 3.4.4 (token.c:608 inflate -3, upstream bug - oc-rsync reads correctly)|standalone"

  # --- Proto <= 29: upstream hard-rejects features that need proto 30+ wire format ---

  # ACLs (up = upstream client -> oc daemon, oc = receiver): oc-rsync's wire
  # receiver drops named-user ACL entries + mask (oc local copy and oc sender
  # both preserve them). At proto <= 29 the same leg is additionally an
  # upstream limitation (compat.c:655-661 hard error, no ACL wire format).
  "up:acls|oc daemon/wire receiver drops named-user ACL entries + mask (oc local + oc sender preserve them); at proto <= 29 also upstream compat.c:655-661 hard error|daemon"
  # Xattrs: upstream compat.c:662-668 hard-exits with RERR_PROTOCOL
  "up:xattrs|xattrs at proto <= 29 (upstream compat.c:662-668 hard error, no xattr wire format)|daemon"
  # Compression algorithm choice: no vstring negotiation at proto < 30
  "up:compress-zstd|zstd at proto <= 29 (upstream compat.c:556-564, no vstring negotiation for codec)|daemon"
  "up:compress-lz4|lz4 at proto <= 29 (upstream compat.c:556-564, no vstring negotiation for codec)|daemon"
  # --- Proto <= 28: upstream hard-rejects filter rules with multi-char prefixes ---

  # Merge-filter: upstream exclude.c:1530 legal_len=1 + send_rules:1623-1627
  # RERR_PROTOCOL (no bytes reach oc-rsync; upstream limitation).
  "up:merge-filter|merge-filter at proto <= 28 (upstream exclude.c:1530 legal_len=1 + send_rules:1623-1627 RERR_PROTOCOL, no bytes reach oc-rsync; upstream limitation)|daemon"

)
