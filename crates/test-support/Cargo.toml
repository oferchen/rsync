[package]
name = "test-support"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Shared test utilities for the oc-rsync workspace"

[dependencies]
socket2 = { workspace = true }
tempfile = { workspace = true }
# `file_times`: the timestamp helpers tests use in place of filetime's
# deprecated setters and readers.
filetime = { workspace = true }

# `sigterm-flag-stub` installs the production daemon signal handlers so the
# reap contract is measured against the real SIGTERM disposition.
platform = { path = "../platform" }
# `capture-rsh` clears inherited `O_NONBLOCK` on stdio through the safe
# `fast_io::force_blocking_stdio` rather than its own fcntl FFI.
fast_io = { path = "../fast_io" }

# Self-signed certificate generation for the QUIC e2e helpers. Optional and
# pulled only by the `quic` feature so the common (non-QUIC) test build never
# compiles the rustls/ring cert stack. Mirrors `rsync_io`'s own `rcgen` gate.
# `rcgen`'s own `pem` feature is left off (it wants a newer `pem` crate than the
# workspace pins); the helper PEM-encodes the DER output with `base64` instead,
# the same shape the `core` connect tests use.
rcgen = { workspace = true, optional = true }
# The oc-rsync daemon library, which `oc_daemon` forks onto a pre-bound
# listener for client tests. Optional so crates that never drive a daemon do
# not build it.
daemon = { path = "../daemon", optional = true }
base64 = { workspace = true, optional = true }

[features]
# QUIC test helpers. Off by default; enabled through the workspace `quic`
# feature so QUIC end-to-end tests can mint a loopback server identity without
# every test build paying for `rcgen`.
quic = ["dep:rcgen", "dep:base64", "daemon?/quic"]
# `oc_daemon`: serve the oc-rsync daemon library to client tests.
daemon = ["dep:daemon"]

[dev-dependencies]

# `OcRsyncCliRunner::umask` pins the spawned child's umask via `pre_exec`, so
# tests asserting mode bits do not silently inherit the caller's umask.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# `stall-rsh` polls a pipe, waits on a pidfd and sends a signal, and its test
# signals the client, all with no unsafe code.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["event", "process"] }

# A default ACL on a fixture directory, for oracle cells that compare
# ACL-derived modes with rsync 3.5.2, without a setfacl binary. Not on musl:
# its targets have no libacl to link, and musl builds of oc-rsync carry no
# ACL support for the cell to measure.
[target.'cfg(all(target_os = "linux", not(target_env = "musl")))'.dev-dependencies]
exacl = { workspace = true }

# Rust port of upstream `support/lsh.sh`. Built as a workspace binary so tests
# can resolve its path via `CARGO_BIN_EXE_lsh-stub` and drive oc-rsync's
# remote-shell code paths locally (design section 5).
[[bin]]
name = "lsh-stub"
path = "src/bin/lsh-stub.rs"

# Remote-shell trampoline that stalls one direction and signals the writer
# once it is blocked (see src/bin/stall-rsh.rs). Linux only.
[[bin]]
name = "stall-rsh"
path = "src/bin/stall-rsh.rs"

# Teeing remote-shell trampoline: relays the client<->server byte streams
# while appending each direction to a capture file, so tests can assert
# byte-identity of whole wire transcripts (see src/transcript.rs).
[[bin]]
name = "capture-rsh"
path = "src/bin/capture-rsh.rs"

# Byte-neutrality A/B gate: captures every network transcript cell (remote
# shell and daemon, push and pull) with two `oc-rsync` builds and reports any
# byte that moved (see src/transcript_cells.rs).
[[bin]]
name = "transcript-ab"
path = "src/bin/transcript-ab.rs"

# Stand-in for an orphaned `oc-rsync --daemon`: carries the production SIGTERM
# disposition and never exits on its own, so `ReapOnDrop` can be tested against
# a child that genuinely survives SIGTERM.
# Cargo target runner that gives every test process a private temp directory,
# so tempfile names drawn by different processes cannot collide (see
# src/tmp_runner.rs). CI selects it on Windows via CARGO_TARGET_<TRIPLE>_RUNNER.
[[bin]]
name = "tmp-runner"
path = "src/bin/tmp-runner.rs"

[[bin]]
name = "sigterm-flag-stub"
path = "src/bin/sigterm-flag-stub.rs"

# Remote-shell trampoline that signals the server after a fixed number of
# relayed bytes, so signal tests deliver at a known wire offset.
[[bin]]
name = "signal-rsh"
path = "src/bin/signal-rsh.rs"

# Remote-shell trampoline that fixes whether the client meets a dying server
# through a failed write or through end of file (see its module docs).
[[bin]]
name = "order-rsh"
path = "src/bin/order-rsh.rs"

[[bin]]
name = "small-buffer-rsh"
path = "src/bin/small-buffer-rsh.rs"

# Remote-shell trampoline that rewrites one byte pattern in one direction,
# so a test can make a real peer send a crafted file list.
[[bin]]
name = "rewrite-rsh"
path = "src/bin/rewrite-rsh.rs"
