[package]
name = "test-support"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Shared test utilities for the oc-rsync workspace"

[dependencies]
tempfile = { workspace = true }

# `sigterm-flag-stub` installs the production daemon signal handlers so the
# reap contract is measured against the real SIGTERM disposition.
platform = { path = "../platform" }

# Self-signed certificate generation for the QUIC e2e helpers. Optional and
# pulled only by the `quic` feature so the common (non-QUIC) test build never
# compiles the rustls/ring cert stack. Mirrors `rsync_io`'s own `rcgen` gate.
# `rcgen`'s own `pem` feature is left off (it wants a newer `pem` crate than the
# workspace pins); the helper PEM-encodes the DER output with `base64` instead,
# the same shape the `core` connect tests use.
rcgen = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }

[features]
# QUIC test helpers. Off by default; enabled through the workspace `quic`
# feature so QUIC end-to-end tests can mint a loopback server identity without
# every test build paying for `rcgen`.
quic = ["dep:rcgen", "dep:base64"]

# The binary-freshness guard compares mtimes, so its tests must set them
# explicitly rather than rely on filesystem timestamp granularity.
[dev-dependencies]
filetime = { workspace = true }

# `OcRsyncCliRunner::umask` pins the spawned child's umask via `pre_exec`, so
# tests asserting mode bits do not silently inherit the caller's umask.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# Rust port of upstream `support/lsh.sh`. Built as a workspace binary so tests
# can resolve its path via `CARGO_BIN_EXE_lsh-stub` and drive oc-rsync's
# remote-shell code paths locally (design section 5).
[[bin]]
name = "lsh-stub"
path = "src/bin/lsh-stub.rs"

# Teeing remote-shell trampoline: relays the client<->server byte streams
# while appending each direction to a capture file, so tests can assert
# byte-identity of whole wire transcripts (see src/transcript.rs).
[[bin]]
name = "capture-rsh"
path = "src/bin/capture-rsh.rs"

# Stand-in for an orphaned `oc-rsync --daemon`: carries the production SIGTERM
# disposition and never exits on its own, so `ReapOnDrop` can be tested against
# a child that genuinely survives SIGTERM.
[[bin]]
name = "sigterm-flag-stub"
path = "src/bin/sigterm-flag-stub.rs"
