[package]
name = "checksums"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[package.metadata.docs.rs]
all-features = true
no-default-features = false
rustdoc-args = ["--cfg", "docsrs", "-D", "rustdoc::broken_intra_doc_links"]
targets = ["x86_64-unknown-linux-gnu"]

[features]
# Default: pure-Rust implementations with automatic hardware acceleration
# (SHA-NI on x86_64, crypto extensions on aarch64 via cpufeatures)
# SIMD features enabled by default for best performance
default = []

# ============================================================================
# Parallel Computation (always compiled)
# ============================================================================
# Parallel checksum computation using rayon is always available.
# This feature alias is kept for backward compatibility with dependents.
parallel = []

# ============================================================================
# Legacy OpenSSL Features (optional)
# ============================================================================
# OpenSSL-based checksums (fallback for platforms without native acceleration)
openssl = ["dep:openssl"]
openssl-vendored = ["openssl", "openssl/vendored"]

[dependencies]
md4 = { version = "0.10", default-features = false, features = ["std"] }
digest = { version = "0.10", default-features = false, features = ["std"] }
xxhash-rust = { version = "0.8", default-features = false, features = ["xxh64", "xxh3"] }
# xxh3 crate provides runtime SIMD detection (AVX2 on x86_64, NEON on aarch64)
xxh3 = { version = "0.1" }
crc32c = { version = "0.6" }
thiserror = { workspace = true }
openssl = { version = "0.10", optional = true }
rayon = { workspace = true }
fast_io = { path = "../fast_io", default-features = false }
logging = { path = "../logging" }

# *-asm crates require NASM on Windows and fail under MSVC; enable asm only on unix.
# The `asm` feature matters beyond the assembly fallback: sha1/sha2 0.10 compile
# their aarch64 hardware backends (ARMv8 SHA1/SHA2/SHA512 via `cpufeatures`)
# only when `asm` is on (sha2 src/sha256.rs, sha1 src/compress.rs). On x86_64
# the SHA-NI backend is compiled either way; `asm` only swaps the fallback.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
md-5 = { workspace = true, features = ["std", "asm"] }
sha1 = { version = "0.10", default-features = false, features = ["std", "asm"] }
sha2 = { version = "0.10", default-features = false, features = ["std", "asm"] }

# sha1-asm 0.5.3 miscomputes on macOS aarch64 (Apple Silicon, macOS 26): it
# returns the wrong SHA1 of empty input (#6076), so md-5 and sha1 stay on the
# portable backend on macOS. SHA-1 therefore runs in software on Apple Silicon.
# sha2 does not call sha1-asm: with `asm` on aarch64 it uses its own inline
# ARMv8 SHA2/SHA3 intrinsics, which is the only way to reach hardware SHA-256
# and SHA-512 there. Intel Macs reach SHA-NI without `asm`, so the sha2-asm
# fallback is not pulled in on x86_64.
[target.'cfg(target_os = "macos")'.dependencies]
md-5 = { workspace = true, features = ["std"] }
sha1 = { version = "0.10", default-features = false, features = ["std"] }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
sha2 = { version = "0.10", default-features = false, features = ["std", "asm"] }

[target.'cfg(all(target_os = "macos", not(target_arch = "aarch64")))'.dependencies]
sha2 = { version = "0.10", default-features = false, features = ["std"] }

[target.'cfg(not(unix))'.dependencies]
md-5 = { workspace = true, features = ["std"] }
sha1 = { version = "0.10", default-features = false, features = ["std"] }
sha2 = { version = "0.10", default-features = false, features = ["std"] }

[dev-dependencies]
test-support = { path = "../test-support" }
libc = { workspace = true }
proptest = { workspace = true }
criterion = { workspace = true }
rand = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "checksums_benchmark"
harness = false

[[bench]]
name = "parallel_benchmark"
harness = false

[[bench]]
name = "pipelined_benchmark"
harness = false

[[bench]]
name = "framing_overhead_benchmark"
harness = false

[[bench]]
name = "md4_multibuffer_benchmark"
harness = false

[[bench]]
name = "md5_multibuffer_benchmark"
harness = false

[[bench]]
name = "bandwidth_constrained"
harness = false

[[bench]]
name = "checksum_mode_benchmark"
harness = false
