# A listening daemon reads its own settings only up to the first module
# header (load_config(1)); a later [global] block changes them only for the
# per-connection parse.
use chroot = no
port = 1111
pid file = /run/early.pid
listen backlog = 3
[mod]
path = /srv/mod
[global]
port = 2222
address = 127.0.0.5
pid file = /run/late.pid
listen backlog = 9
socket options = SO_KEEPALIVE
