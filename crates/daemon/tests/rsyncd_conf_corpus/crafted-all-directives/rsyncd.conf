# Every rsync 3.5.1 daemon parameter, set in the global section and again in a
# module, spelled with the case and whitespace variations strwiEQ accepts.
address = 127.0.0.1
daemon chroot = /srv/chroot
daemon gid = 0
daemon uid = 0
motd file = /etc/rsyncd.motd
pid file = /run/rsyncd.pid
proxy protocol hosts = 127.0.0.1
socket options = SO_KEEPALIVE
listen backlog = 7
port = 8873
proxy protocol = yes
auth digest = sha256
auth users = alice
charset = utf-8
comment = global comment
dont compress = *.gz *.zip
early exec = /bin/true
exclude = *.tmp
exclude from = /etc/rsync.exclude
filter = - *.bak
gid = 0
hosts allow = 10.0.0.0/8
hosts deny = 10.9.9.9
include = *.keep
include from = /etc/rsync.include
incoming chmod = Dg+s
lock file = /run/rsyncd.lock
log file = /var/log/rsyncd.log
log format = %o %f
name = ignored
name converter = /bin/cat
outgoing chmod = Fo-w
post-xfer exec = /bin/true
pre-xfer exec = /bin/true
refuse options = delete
secrets file = /etc/rsyncd.secrets
syslog tag = oc-global
uid = 0
path = /srv/global
temp dir = /tmp/
max connections = 3
max verbosity = 2
timeout = 60
syslog facility = local3
fake super = yes
forward lookup = no
ignore errors = yes
ignore nonreadable = yes
insecure links = yes
list = no
read only = no
reverse lookup = no
strict modes = no
transfer logging = yes
write only = yes
munge symlinks = no
numeric ids = yes
open noatime = yes
use chroot = no

[all]
AUTH DIGEST = sha512
Auth Users = bob, carol
charset = latin1
comment = module comment
dontcompress = *.xz
early exec = /bin/false
exclude = *.o
exclude from = /etc/other.exclude
filter = + *.c
gid = 0
hosts  allow = 127.0.0.1
hosts deny =
include = *.h
include from = /etc/other.include
incoming chmod = Du+w
lock file = /run/other.lock
log file = /var/log/other.log
log format = %f
name converter =
outgoing chmod =
post-xfer exec =
pre-xfer exec = /bin/false
refuse options = compress checksum
secrets file = /etc/other.secrets
syslog tag = oc-module
uid = 0
path = /srv/all/
temp dir = tmp
max connections = 0
max verbosity = 5
timeout = 0
syslog facility = 19
fake super = no
forward lookup = yes
ignore errors = no
ignore nonreadable = no
insecure links = no
list = yes
read only = yes
reverse lookup = yes
strict modes = yes
transfer logging = no
write only = no
munge symlinks = unset
numeric ids = -1
open noatime = no
use chroot = unset
# Global-only parameters in a module are reported and ignored.
port = 1
pid file = /elsewhere

[defaults]
path = /srv/defaults
