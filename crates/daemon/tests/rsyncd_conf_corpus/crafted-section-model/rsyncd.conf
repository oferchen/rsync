# Globals are copied into a section when it is created; a string the section
# never had falls back to the final global value.
use chroot = no
hosts allow = 10.0.0.1
read only = no
[early]
path = /srv/early
[global]
hosts allow = 10.0.0.2
read only = yes
auth users = late
[late]
path = /srv/late
[EARLY]
comment = reopened
[merged]
path = /srv/merged
&merge snippet.inc
list = no
[after-include]
path = /srv/after
&include section.conf
list = no
[final]
path = /srv/final
