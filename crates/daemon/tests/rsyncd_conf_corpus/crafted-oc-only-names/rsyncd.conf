# Names oc once accepted that upstream rsync does not know. Upstream logs each
# as an unknown parameter and ignores it; nothing else changes.
use chroot = no
bwlimit = 100
motd = hello
acceptor threads = 4
rsync port = 8730
incoming-chmod = Dg+s
outgoing-chmod = Fo-w
port = 9999
[mod]
path = /srv/mod
bwlimit = 5
incoming-chmod = Du+w
outgoing-chmod = Fu+w
motd = module line
