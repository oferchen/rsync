name: Test Feature Combinations

on:
  workflow_call:
    inputs:
      cache_version:
        description: 'Cache version for invalidation'
        type: string
        default: 'v1'
      rust_toolchain:
        description: 'Rust toolchain version'
        type: string
        default: 'stable'
      timeout_minutes:
        description: 'Job timeout in minutes'
        type: number
        default: 45

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Cross-OS feature rows.
  #
  # Promoted to a cross-OS strategy matrix per the cross-platform CI coverage
  # audit (gap G6). Every row in this matrix exercises code that compiles on
  # Linux, macOS, and Windows. To keep within the runtime budget, only the
  # rows that the audit flagged as OS-agnostic but Linux-only today are run
  # across all three OS; the remaining rows stay Linux-only (they overlap
  # with the per-OS --all-features jobs already in ci.yml).
  # ---------------------------------------------------------------------------
  feature-flags-cross-os:
    name: ${{ matrix.row.name }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.timeout_minutes }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # `needs_bin` marks rows that need `oc-rsync` built before the test
        # step. A package-scoped `cargo nextest run` never builds it - only
        # `--workspace` pulls in the root `bin` package that owns the
        # `[[bin]]` - and the tests that spawn it resolve exactly one path
        # (`<target>/<profile>/oc-rsync`, baked in from `OUT_DIR`), so an
        # unbuilt binary is a hard failure or, for the `require_binary`
        # ports, a permanent self-skip.
        #
        # The flag is set per selected *crate*, not per currently-failing
        # test: `cli`, `core`, `engine`, `metadata` and `transfer` are the
        # crates whose test targets reference the resolver, so any row
        # selecting one of them is true. Deciding per test would leave rows
        # that only pass because their bin-spawning tests are `#[ignore]`d,
        # env-gated or filtered out - one edit away from breaking. Re-derive
        # with:
        #   grep -rl 'oc_rsync_bin\|workspace_bin\|require_binary\|OcRsyncCliRunner' crates/
        row:
          - name: async
            args: "-p daemon -p core -p protocol -p engine --features async"
            needs_bin: true
          - name: tracing
            args: "-p daemon -p core -p engine --features tracing"
            needs_bin: true
          - name: serde
            args: "-p logging -p protocol -p flist --features serde"
            needs_bin: false
          - name: concurrent-sessions
            args: "-p daemon --features concurrent-sessions"
            needs_bin: false
          - name: iconv
            args: "-p protocol -p transfer -p engine -p core -p cli -p daemon --features iconv"
            needs_bin: true

    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-D warnings"
      RUST_BACKTRACE: "full"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          df -h /

      - name: Install Rust (${{ inputs.rust_toolchain }})
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          toolchain: ${{ inputs.rust_toolchain }}

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          shared-key: ci-${{ runner.os }}-cargo-${{ inputs.cache_version }}-${{ hashFiles('**/Cargo.lock') }}
          key: features-${{ matrix.row.name }}-${{ matrix.os }}

      - name: Install cargo-nextest (Unix)
        if: runner.os != 'Windows'
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2
        with:
          tool: cargo-nextest

      - name: Install cargo-nextest (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/install-cargo-nextest-windows

      # Built at the default feature set, which is both necessary and
      # sufficient. Necessary: the root `bin` package declares no `tracing`,
      # `serde`, `concurrent-sessions` or `incremental-flist` feature, so
      # forwarding a row's `--features` would be a hard error. Sufficient:
      # every feature these rows do exercise end-to-end through the binary
      # (iconv, zstd, lz4, io_uring, and incremental-flist via `transfer`'s
      # own defaults) is already on by default. The profile is unchanged, so
      # the binary lands in exactly the directory the resolver derives.
      - name: Build oc-rsync (for subprocess integration tests)
        if: matrix.row.needs_bin
        run: cargo build --locked -p bin --bin oc-rsync

      - name: Test (${{ matrix.row.name }})
        run: cargo nextest run --locked --profile ci ${{ matrix.row.args }}

  # ---------------------------------------------------------------------------
  # Linux-only feature rows.
  #
  # Includes:
  # - Pre-existing rows that test the original Linux-only matrix and the
  #   platform-gated I/O features (io_uring, copy_file_range).
  # - New crypto / deflate backend rows (openssl, openssl-vendored, zlib-ng,
  #   zlib-rs) per the audit's G1/G2 recommendation. Linux-only initially:
  #   the openssl rows depend on system libssl (already pre-installed on
  #   ubuntu-latest); zlib-ng links against libz-ng-dev. macOS/Windows can
  #   follow once the equivalent staging is validated; tracking via the
  #   audit's section 7 follow-ups.
  # ---------------------------------------------------------------------------
  feature-flags-linux:
    name: ${{ matrix.name }} (linux)
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}

    strategy:
      fail-fast: false
      matrix:
        # Same `needs_bin` rule as the cross-OS matrix above: true for any row
        # selecting `cli`, `core`, `engine`, `metadata` or `transfer`. The
        # `default-features` row is `--workspace`, which already builds the
        # root `bin` package, so it stays false.
        include:
          # PFF-6: Verify the default-features build compiles and passes
          # tests. The main CI test job uses --all-features which may mask
          # regressions in the default feature set.
          - name: default-features
            args: "--workspace"
            apt: ""
            needs_bin: false
          - name: parallel
            args: "-p checksums -p flist --features parallel"
            apt: ""
            needs_bin: false
          # `incremental-flist` is in `transfer`'s own `default` list, so a row
          # of the form `-p transfer --features incremental-flist` turns nothing
          # on that was not already on - it re-tests the default configuration
          # under a name that claims otherwise. The feature IS covered on:
          # the `default-features` row above, the main `--all-features` test
          # job, and every library consumer.
          #
          # What was NOT covered anywhere is the feature OFF. That matters more
          # than the ON case: `bin` pins `transfer` with
          # `default-features = false` (root Cargo.toml), so the SHIPPED BINARY
          # runs the off-path receiver while every other job runs the on-path
          # one. Production took one code path and CI tested the other, which is
          # how four successive receiver-dispatch divergences reached master.
          #
          # The feature list is the musl job's (ci.yml), which is the only other
          # place in the repo that builds with defaults off. Bare
          # `--no-default-features` would also drop zstd/lz4/xattr and test a
          # different question.
          - name: no-incremental-flist
            args: "--workspace --no-default-features --features zstd,lz4,xattr,iconv,parallel,copy_file_range"
            apt: ""
            needs_bin: true
          - name: compression
            args: "-p compress -p protocol -p engine -p transfer --features zstd,lz4"
            apt: ""
            needs_bin: true
          - name: io_uring
            args: "-p transfer -p fast_io --features io_uring"
            apt: ""
            needs_bin: true
          - name: copy_file_range
            args: "-p fast_io --features copy_file_range"
            apt: ""
            needs_bin: false
          - name: landlock
            args: "-p fast_io --features landlock"
            apt: ""
            needs_bin: false
          - name: openssl
            args: "-p checksums --features openssl"
            apt: "libssl-dev pkg-config"
            needs_bin: false
          - name: openssl-vendored
            args: "-p checksums --features openssl-vendored"
            apt: "pkg-config"
            needs_bin: false
          - name: zlib-ng
            args: "-p compress -p protocol --features zlib-ng"
            apt: "zlib1g-dev"
            needs_bin: false
          - name: zlib-rs
            args: "-p compress -p protocol --no-default-features --features zlib-rs"
            apt: ""
            needs_bin: false

    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-D warnings"
      RUST_BACKTRACE: "full"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          df -h /

      - name: Install Rust (${{ inputs.rust_toolchain }})
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          toolchain: ${{ inputs.rust_toolchain }}

      - name: Install APT packages
        if: matrix.apt != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.apt }}

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          shared-key: ci-${{ runner.os }}-cargo-${{ inputs.cache_version }}-${{ hashFiles('**/Cargo.lock') }}
          key: features-${{ matrix.name }}-linux

      - name: Install cargo-nextest (Unix)
        if: runner.os != 'Windows'
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2
        with:
          tool: cargo-nextest

      - name: Install cargo-nextest (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/install-cargo-nextest-windows

      - name: Build oc-rsync (for subprocess integration tests)
        if: matrix.needs_bin
        run: cargo build --locked -p bin --bin oc-rsync

      - name: Test (${{ matrix.name }})
        run: cargo nextest run --locked --profile ci ${{ matrix.args }}
