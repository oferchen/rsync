# Windows nightly long-path (\\?\) test cell (WCI-7 #3701).
#
# The required `Windows (stable)` cell in ci.yml does not link the
# `protocol` crate's Windows-only `wire_path.rs` tests, even though
# their `#[cfg(windows)]` gates were authored precisely to make them
# run on Windows. WCI-1 (PR #5639, see
# docs/audits/wci-1-windows-nextest-coverage-gap.md section 4.2)
# inventoried four such tests:
#
#   - windows_backslash_is_translated_to_forward_slash
#   - windows_deep_path_is_translated
#   - windows_already_forward_slash_borrows
#   - windows_mixed_separators_are_normalized
#
# These guard the wire-byte path-separator encoder used by every
# `FileEntry` name emitted by an oc-rsync push from Windows. A
# regression in this encoder silently corrupts every wire byte
# carrying a path component, so the cost of a missing test cell is
# disproportionate to the test's compile cost.
#
# This workflow also runs the WPC-5'.10 long-path metadata round-trip
# integration tests (`long_path_acl_round_trip`,
# `long_path_ads_round_trip` in `crates/metadata/tests/windows_long_path_metadata.rs`)
# which fan a 600+ character path tree through ACL and ADS write/read
# paths via `fast_io::to_extended_path`. The required Windows cell
# does not exercise these because the `acl,xattr` feature combination
# they require is not the default-features set that the per-PR
# Windows matrix builds.
#
# Status: non-required (informational). Do not add to branch protection.
# Promotion to required-on-PR is gated on a 14-day green bake window
# per WCI-11 #3705.
name: Windows nightly long-path

on:
  schedule:
    # Nightly at 07:00 UTC. Offset from WCI-2 Windows IOCP (05:00 UTC)
    # to keep the Windows runner pool uncontended and to spread
    # nightly Windows wall-time across the runner schedule.
    - cron: '0 7 * * *'
  workflow_dispatch:
  # Deliberately UNFILTERED, matching ci.yml: once this leg is promoted to a
  # required context it must run on every pull request or the required check
  # never arrives and the pull request is unmergeable. Until the branch-
  # protection flip it runs per-PR as a non-blocking bake.
  pull_request:

concurrency:
  group: windows-nightly-long-path-${{ github.ref }}
  # Cancel a superseded run only on pull-request pushes; never cancel a
  # nightly schedule run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: "full"

jobs:
  windows-long-path:
    name: Windows long-path (\\?\) round-trip
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          shared-key: ci-windows-long-path-cargo-v1-${{ hashFiles('**/Cargo.lock') }}
          key: windows-nightly-long-path

      - name: Install cargo-nextest (Windows)
        uses: ./.github/actions/install-cargo-nextest-windows

      # Run the full `-p protocol` test set on Windows with no name filter.
      # The `windows_` substring allowlist would silently skip any new
      # `#[cfg(windows)]` protocol test that did not adopt the prefix, so
      # the cell could pass while a wire_path separator-encoder regression
      # slipped in under a differently-named test. Running the whole package
      # exercises every Windows-compiled protocol test, including the
      # wire_path encoder the audit flagged, without depending on a naming
      # convention. Running with default features mirrors how the per-PR
      # Windows cell would link the crate after promotion.
      - name: Run protocol Windows tests (full package)
        run: cargo nextest run --locked -p protocol --no-fail-fast

      # Run the full `-p metadata` test set with acl,xattr on Windows and
      # no name filter. The `long_path_` allowlist would silently skip any
      # new Windows ACL/ADS/long-path metadata test, so the cell could stay
      # green while a round-trip regressed. Running the whole package with
      # both feature flags active exercises every Windows-compiled metadata
      # test - the 600+ char ACL and ADS round-trips plus any future
      # capability test - without depending on a naming convention.
      # `metadata` owns tests that spawn `oc-rsync.exe` as a subprocess, and
      # a package-scoped run now includes them, so build the binary first.
      - name: Build oc-rsync (for subprocess integration tests)
        run: cargo build --locked -p bin --bin oc-rsync

      - name: Run metadata Windows tests (full package, acl+xattr)
        run: cargo nextest run --locked -p metadata --features acl,xattr --no-fail-fast

      - name: Upload nextest logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-nightly-long-path-logs
          path: |
            target/nextest/**/*.log
            target/nextest/**/*.xml
          if-no-files-found: ignore
          retention-days: 14
