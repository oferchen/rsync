name: Upstream Testsuite

on:
  workflow_call:
    inputs:
      cache_version:
        description: 'Cache version for invalidation'
        type: string
        default: 'v1'
      upstream_rsync_version:
        description: 'Upstream rsync version for cache key'
        type: string
        default: '3.5.0'
      variant:
        description: 'Which variant(s) to run: all | nonroot | root'
        type: string
        default: 'all'
      expect_result_nonroot:
        description: >-
          Path to the non-root leg's runtests.py --expect-result manifest. When
          set, ONLY the tests it names are run and every outcome must match, so
          a truncated manifest shrinks coverage instead of failing - the driver
          refuses a missing or empty one. Leave empty to run the whole suite and
          fail on any failure. Ignored by the 3.4.4 shell-loop path.
        type: string
        default: ''
      expect_result_root:
        description: >-
          The ROOT leg's manifest. Deliberately a separate input: the two legs
          run the same 345 tests at different privilege, and 40 of them resolve
          to a DIFFERENT outcome (measured, run 32260924822), so one shared file
          would be wrong for 40 tests.
        type: string
        default: ''
      transport:
        description: >-
          Daemon transport for the Python suite: `pipe` (upstream's secure
          default - a stdio socketpair, no listening socket) or `tcp` (a real
          rsyncd bound to 127.0.0.1). Crossed with `variant` this gives the four
          3.5.0 legs: {nonroot,root} x {pipe,tcp}.

          `tcp` additionally passes --daemon-tests-only, which is what upstream
          ships it for: "Intended for a --use-tcp pass that follows a full
          default-transport run: the tests this drops never call
          start_test_daemon(), so they cannot observe --use-tcp and would just
          repeat themselves." So the tcp legs run the 155 transport-observing
          tests, not all 345, and their manifests are sized to match - the
          driver derives that expected size from upstream's OWN
          select_daemon_tests(), so the coverage guard still refuses a manifest
          that names fewer tests than the run will select.

          Defaults to `pipe`, so existing callers - and the two REQUIRED check
          contexts they declare - are unchanged.
        type: string
        default: 'pipe'
      legacy_oracles:
        description: >-
          `on` builds the historical rsync binaries the 3.5.0 testsuite looks
          for in old_versions/ (see tools/ci/run_upstream_testsuite.sh,
          ensure_legacy_oracles) so the tests that name a release assert
          against that release. `off` (default) builds none, and the harness
          NAMES every test that will therefore assert against a static fallback
          instead - the degradation stays visible either way.

          Off by default because putting those binaries on disk un-skips
          daemon-max-alloc-zero, i.e. it MOVES rows in this leg's
          --expect-result manifest. Manifest rows may only be re-baselined from
          a measured run, so a leg opts in when someone is ready to measure the
          move, never as a side effect of an unrelated change.
        type: string
        default: 'off'

permissions:
  contents: read

env:
  APT_PACKAGES: build-essential pkg-config zlib1g-dev curl autoconf automake libtool libacl1-dev libattr1-dev libzstd-dev liblz4-dev libxxhash-dev

jobs:
  upstream-testsuite:
    # DELIBERATELY A LITERAL, not an expression on `transport`. MEASURED on run
    # 32390202763: GitHub evaluates a `name:` expression only for a job that
    # RUNS - a job skipped by its `if:` reports the raw expression text as its
    # name instead. This job's name is half of the REQUIRED context
    # `upstream-testsuite / upstream testsuite`, so the moment any caller passes
    # a `variant` that skips it, that context would report under a garbage name
    # and the required check would never arrive. The transport is already
    # visible in the context via the caller's job id (e.g.
    # `upstream-testsuite-tcp / upstream testsuite`) and in the workflow name.
    name: upstream testsuite
    if: ${{ inputs.variant == 'all' || inputs.variant == 'nonroot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-D warnings"
      RUST_BACKTRACE: "full"
      CACHE_VERSION: ${{ inputs.cache_version }}
      UPSTREAM_RSYNC_VERSION: ${{ inputs.upstream_rsync_version }}
      TRANSPORT: ${{ inputs.transport }}
      USE_TCP: ${{ inputs.transport == 'tcp' && 'yes' || 'no' }}
      DAEMON_TESTS_ONLY: ${{ inputs.transport == 'tcp' && 'yes' || 'no' }}
      LEGACY_ORACLES: ${{ inputs.legacy_oracles }}

    steps:
      - name: Validate transport input
        # `USE_TCP` above is a boolean collapse: anything that is not exactly
        # 'tcp' silently becomes the pipe leg. A typo would then report a green
        # "tcp" run that never opened a socket, so reject it here instead.
        run: |
          set -euo pipefail
          case "${TRANSPORT}" in
            pipe|tcp) ;;
            *) echo "::error::transport must be 'pipe' or 'tcp', got '${TRANSPORT}'"; exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          shared-key: ci-${{ runner.os }}-cargo-${{ env.CACHE_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          key: upstream-testsuite
          cache-on-failure: true

      - name: Cache APT packages
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: ${{ env.APT_PACKAGES }}
          version: ${{ env.CACHE_VERSION }}

      - name: Verify APT packages are installed
        # The cache reports a hit from its own manifest, not from
        # the machine, so a payload-less entry installs nothing
        # and reports success. Ask dpkg instead. See the script.
        run: tools/ci/ensure_apt_packages.sh $APT_PACKAGES

      - name: Cache upstream rsync source
        id: cache-upstream
        # The cached tree also carries old_versions/rsync_<ver>, the legacy
        # daemon oracle the harness builds for the tests that assert against a
        # real old rsync rather than a static prediction of one - so
        # build_old_rsync_oracle.sh is part of the key: change how the oracle is
        # built and the tree holding it must be rebuilt, not restored.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/interop/upstream-src/rsync-${{ env.UPSTREAM_RSYNC_VERSION }}
          key: upstream-testsuite-src-${{ env.UPSTREAM_RSYNC_VERSION }}-${{ hashFiles('tools/ci/run_upstream_testsuite.sh', 'tools/ci/build_old_rsync_oracle.sh') }}-${{ runner.os }}

      - name: Build oc-rsync (release)
        uses: ./.github/actions/build-oc-rsync

      - name: Run upstream testsuite
        id: testsuite
        env:
          OC_RSYNC_BIN: target/release/oc-rsync
          UPSTREAM_VERSION: ${{ env.UPSTREAM_RSYNC_VERSION }}
          EXPECT_RESULT: ${{ inputs.expect_result_nonroot }}
          # Always emit the manifest this run would hold itself to. It is the
          # only honest source for `expect_result`: hand-curating the ledger is
          # exactly how it drifts out of agreement with the suite, and because
          # --expect-result runs ONLY the tests it names, that drift shrinks
          # coverage silently instead of failing. Uploaded as an artifact so a
          # re-baseline is a reviewable diff of outcome changes.
          EMIT_EXPECT_RESULT: target/interop/expect-result.nonroot.${{ inputs.transport }}.txt
        run: |
          set -euo pipefail
          mkdir -p target/interop
          bash tools/ci/run_upstream_testsuite.sh 2>&1 | tee target/interop/upstream-testsuite-output.log
        # No step-level continue-on-error: a non-zero exit from the harness
        # (UNEXPECTED FAIL outside known_failures.conf or UPASS regression)
        # MUST surface to the job conclusion so PRs that claim to fix an
        # upstream test can be validated against the per-test result.

      - name: Generate job summary
        if: always()
        run: |
          set -euo pipefail
          OUTPUT_LOG="target/interop/upstream-testsuite-output.log"

          echo "## Upstream Testsuite Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [[ ! -f "$OUTPUT_LOG" ]]; then
            echo "No test output found." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Extract the summary block from the runner output
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          sed -n '/^----/,$ p' "$OUTPUT_LOG" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Highlight UPASS results - these mean known_failures.conf needs updating
          UPASS_LINES=$(grep '^UPASS' "$OUTPUT_LOG" || true)
          if [[ -n "$UPASS_LINES" ]]; then
            echo "### Unexpected Passes (UPASS)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "These tests are listed in \`tools/ci/upstream_testsuite_known_failures.conf\` but now pass." >> "$GITHUB_STEP_SUMMARY"
            echo "Remove them from the known failures list." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$UPASS_LINES" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Highlight unexpected FAILs
          FAIL_LINES=$(grep '^FAIL' "$OUTPUT_LOG" || true)
          if [[ -n "$FAIL_LINES" ]]; then
            echo "### Unexpected Failures" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "These tests failed and are NOT in the known failures list." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$FAIL_LINES" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Show per-test results table
          echo "<details><summary>Full test results</summary>" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Status | Test |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|------|" >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(PASS|FAIL|XFAIL|UPASS|SKIP)' "$OUTPUT_LOG" | while IFS= read -r line; do
            STATUS=$(echo "$line" | awk '{print $1}')
            TEST=$(echo "$line" | awk '{print $2}')
            echo "| $STATUS | $TEST |" >> "$GITHUB_STEP_SUMMARY"
          done || true
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "</details>" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload testsuite logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upstream-testsuite-logs-${{ inputs.transport }}
          path: |
            target/interop/upstream-testsuite/
            target/interop/upstream-testsuite-output.log
            target/interop/expect-result.nonroot.${{ inputs.transport }}.txt
          if-no-files-found: ignore
          retention-days: 14

  # ===========================================================================
  # Root leg (FAILS LOUD; not yet a required gate). The non-root job above is
  # the REQUIRED gate. This job re-runs the SAME suite under sudo so the
  # root-only tests (chown/devices/xattrs/dir-sgid/protected-regular) that
  # self-skip as the runner user actually RUN. A non-zero harness exit now FAILS
  # this job - there is no `continue-on-error` and no run-step `|| true`, so a
  # root-only regression surfaces as a RED check instead of a silently-masked
  # green. This job is deliberately NOT in the required status checks, so a red
  # leg does not block the merge queue; it is a visible signal. Promote it to a
  # required gate once it is reliably green.
  #
  # The two legs differ only in privilege, so their outcomes differ per test and
  # each needs its OWN `expect_result` manifest - hence the separate
  # `expect-result.root.txt` emission. Measured on a 4-leg 3.5.0 run: 348
  # distinct test names, 78 of which resolve to a DIFFERENT outcome between
  # legs, so a single shared manifest would be wrong for 78 tests.
  # ===========================================================================
  upstream-testsuite-root:
    # A literal for the same reason as the non-root job above - see that comment.
    name: upstream testsuite (root)
    if: ${{ inputs.variant == 'all' || inputs.variant == 'root' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-D warnings"
      RUST_BACKTRACE: "full"
      CACHE_VERSION: ${{ inputs.cache_version }}
      UPSTREAM_RSYNC_VERSION: ${{ inputs.upstream_rsync_version }}
      TRANSPORT: ${{ inputs.transport }}
      USE_TCP: ${{ inputs.transport == 'tcp' && 'yes' || 'no' }}
      DAEMON_TESTS_ONLY: ${{ inputs.transport == 'tcp' && 'yes' || 'no' }}
      LEGACY_ORACLES: ${{ inputs.legacy_oracles }}

    steps:
      - name: Validate transport input
        run: |
          set -euo pipefail
          case "${TRANSPORT}" in
            pipe|tcp) ;;
            *) echo "::error::transport must be 'pipe' or 'tcp', got '${TRANSPORT}'"; exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          shared-key: ci-${{ runner.os }}-cargo-${{ env.CACHE_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          key: upstream-testsuite-root
          cache-on-failure: true

      - name: Cache APT packages
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: ${{ env.APT_PACKAGES }}
          version: ${{ env.CACHE_VERSION }}

      - name: Verify APT packages are installed
        # The cache reports a hit from its own manifest, not from
        # the machine, so a payload-less entry installs nothing
        # and reports success. Ask dpkg instead. See the script.
        run: tools/ci/ensure_apt_packages.sh $APT_PACKAGES

      - name: Cache upstream rsync source
        id: cache-upstream
        # The cached tree also carries old_versions/rsync_<ver>, the legacy
        # daemon oracle the harness builds for the tests that assert against a
        # real old rsync rather than a static prediction of one - so
        # build_old_rsync_oracle.sh is part of the key: change how the oracle is
        # built and the tree holding it must be rebuilt, not restored.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/interop/upstream-src/rsync-${{ env.UPSTREAM_RSYNC_VERSION }}
          key: upstream-testsuite-src-${{ env.UPSTREAM_RSYNC_VERSION }}-${{ hashFiles('tools/ci/run_upstream_testsuite.sh', 'tools/ci/build_old_rsync_oracle.sh') }}-${{ runner.os }}

      - name: Build oc-rsync (release)
        uses: ./.github/actions/build-oc-rsync

      - name: Run upstream testsuite (root)
        id: testsuite
        env:
          OC_RSYNC_BIN: target/release/oc-rsync
          UPSTREAM_VERSION: ${{ env.UPSTREAM_RSYNC_VERSION }}
          EXPECT_RESULT: ${{ inputs.expect_result_root }}
          EMIT_EXPECT_RESULT: target/interop/expect-result.root.${{ inputs.transport }}.txt
        run: |
          set -uo pipefail
          mkdir -p target/interop
          # Passwordless sudo re-exec so root-only tests RUN. Forward the env
          # the harness reads (a bare `sudo` scrubs it) plus the GHA summary
          # sink. Fail loud: a non-zero harness exit fails this job so a root-only
          # test regression (devices/chown/xattrs/...) surfaces as red, not a
          # silently-masked green.|
          sudo env \
            "PATH=$PATH" \
            "OC_RSYNC_BIN=$OC_RSYNC_BIN" \
            "UPSTREAM_VERSION=$UPSTREAM_VERSION" \
            "EXPECT_RESULT=${EXPECT_RESULT:-}" \
            "EMIT_EXPECT_RESULT=${EMIT_EXPECT_RESULT:-}" \
            "USE_TCP=${USE_TCP:-no}" \
            "DAEMON_TESTS_ONLY=${DAEMON_TESTS_ONLY:-no}" \
            "LEGACY_ORACLES=${LEGACY_ORACLES:-off}" \
            "GITHUB_ACTIONS=${GITHUB_ACTIONS:-}" \
            "GITHUB_STEP_SUMMARY=${GITHUB_STEP_SUMMARY:-}" \
            bash tools/ci/run_upstream_testsuite.sh 2>&1 \
            | tee target/interop/upstream-testsuite-root-output.log
          rc=${PIPESTATUS[0]}
          # Reclaim root-owned scratch/logs for the upload + post-job cache.
          sudo chown -R "$(id -u):$(id -g)" target/interop 2>/dev/null || true
          exit "$rc"

      - name: Upload testsuite logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upstream-testsuite-root-logs-${{ inputs.transport }}
          path: |
            target/interop/upstream-testsuite/
            target/interop/upstream-testsuite-root-output.log
            target/interop/expect-result.root.${{ inputs.transport }}.txt
          if-no-files-found: ignore
          retention-days: 14
