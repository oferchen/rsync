name: CI

on:
  pull_request:
    paths:
      - 'Formula/**'
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - '.github/CODEOWNERS'
      - '.github/dependabot.yml'
      - '.github/FUNDING.yml'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/RELEASE_NOTES_BETA.md'
      - '.github/RELEASE_TEMPLATE.md'
      - '.github/release.yml'
      - '.github/scripts/**'
      - 'scripts/**'
      - 'packaging/**'
      - 'dist-workspace.toml'
      - '.dockerignore'
      - '.gitignore'
      - '.gitattributes'
      - 'deny.toml'
      # Deliberately NO '.github/workflows/**' entry. ci.yml now matches that
      # whole directory itself, so every workflow-touching pull request runs
      # the real matrix and this shim must stay out of the way.
      #
      # The previous attempt listed the directory here and negated the six
      # files ci.yml watched. That cannot work: `paths` is an ANY-match over
      # the post-negation set, so the negations only remove those files - they
      # cannot say "if this changed, do not skip". A pull request touching an
      # excluded file AND any other workflow file still matched on the latter
      # and fired the shim, which published a stand-in green for required
      # contexts it never ran. MEASURED on two commits of the 3.5.0 testsuite
      # branch, both of which changed ci.yml and _upstream-testsuite.yml.
      #
      # Keeping the two trigger sets DISJOINT is what makes exactly one
      # workflow emit each required context - no duplicate check runs, and no
      # race over which one reports last.

concurrency:
  group: ci-skip-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - run: echo "Skipped — no code changes"

  test:
    name: nextest (stable)
    runs-on: ubuntu-latest
    steps:
      - run: echo "Skipped — no code changes"

  windows-test:
    name: Windows (stable)
    runs-on: ubuntu-latest
    steps:
      - run: echo "Skipped — no code changes"

  macos-test:
    name: macOS (stable)
    runs-on: ubuntu-latest
    steps:
      - run: echo "Skipped — no code changes"

  musl-test:
    name: Linux musl (stable)
    runs-on: ubuntu-latest
    steps:
      - run: echo "Skipped — no code changes"

  interop:
    name: interop
    uses: ./.github/workflows/_ci-skip-interop.yml

  interop-macos:
    name: interop (macOS)
    uses: ./.github/workflows/_ci-skip-interop-macos.yml

  interop-windows:
    name: interop (Windows, best-effort)
    uses: ./.github/workflows/_ci-skip-interop-windows.yml

  upstream-testsuite:
    uses: ./.github/workflows/_ci-skip-upstream-testsuite.yml

  # ci.yml calls the same reusable testsuite workflow a second time under this
  # job id for the loopback-TCP transport, so it publishes a second PAIR of
  # contexts (`upstream-testsuite-tcp / upstream testsuite` and
  # `... (root)`). The stand-in is the SAME stub workflow: the job id supplies
  # the differing prefix, and the two job names it declares are exactly the two
  # that need mirroring. Reusing it rather than copying keeps one file as the
  # owner of "which contexts the testsuite publishes" - a copy is what drifts
  # when a third leg is added.
  upstream-testsuite-tcp:
    uses: ./.github/workflows/_ci-skip-upstream-testsuite.yml
