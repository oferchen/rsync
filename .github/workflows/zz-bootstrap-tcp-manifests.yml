name: BOOTSTRAP TCP manifests (temporary)

# TEMPORARY - DELETE BEFORE MERGE.
#
# The two loopback-TCP legs each need an --expect-result manifest, and a
# manifest must be GENERATED from a real run on the runner that will hold
# itself to it, never hand-typed: --expect-result runs ONLY the tests it names,
# so a typed manifest silently shrinks coverage instead of failing.
#
# This runs both TCP legs with NO manifest so the driver's EMIT_EXPECT_RESULT
# path writes one from the actual outcomes and uploads it as an artifact. Both
# jobs are EXPECTED TO FAIL: without a manifest runtests.py fails on any
# failing test, and the 3.5.0 divergences are real. The artifact is the
# deliverable, not the job conclusion.
#
# A push trigger is used because workflow_dispatch is only offered for
# workflows that already exist on the default branch.
on:
  push:
    branches:
      - ci/upstream-350-transport-legs

permissions:
  contents: read

jobs:
  nonroot-tcp:
    uses: ./.github/workflows/_upstream-testsuite.yml
    with:
      upstream_rsync_version: '3.5.0'
      variant: 'nonroot'
      transport: 'tcp'

  root-tcp:
    uses: ./.github/workflows/_upstream-testsuite.yml
    with:
      upstream_rsync_version: '3.5.0'
      variant: 'root'
      transport: 'tcp'
