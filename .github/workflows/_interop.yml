name: Interop Tests

on:
  workflow_call:
    inputs:
      cache_version:
        description: 'Cache version for invalidation'
        type: string
        default: 'v1'
      upstream_rsync_version:
        description: 'Upstream rsync version for cache key'
        type: string
        default: '3.5.1'
      rust_toolchain:
        description: 'Rust toolchain version'
        type: string
        default: 'stable'
      timeout_minutes:
        description: 'Job timeout in minutes'
        type: number
        default: 30
      skip:
        description: >-
          Skip the job. Set for docs-only pull requests: skipping HERE rather
          than at the caller keeps the required context's full
          `<caller> / interop with upstream rsync` name.
        type: boolean
        default: false

permissions:
  contents: read

env:
  # libidn2-dev: rsync 3.5.1's configure aborts without idn2.h, and the
  # interop sweep builds 3.5.1 alongside the older peers.
  APT_PACKAGES: build-essential pkg-config zlib1g-dev curl autoconf automake libtool acl libacl1-dev libattr1-dev libzstd-dev liblz4-dev libxxhash-dev libidn2-dev

jobs:
  interop:
    name: interop with upstream rsync
    if: ${{ !inputs.skip }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}

    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-D warnings"
      RUST_BACKTRACE: "full"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (${{ inputs.rust_toolchain }})
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          toolchain: ${{ inputs.rust_toolchain }}

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          shared-key: ci-${{ runner.os }}-cargo-${{ inputs.cache_version }}-${{ hashFiles('**/Cargo.lock') }}
          key: interop

      - name: Cache APT packages
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: ${{ env.APT_PACKAGES }}
          version: ${{ inputs.cache_version }}

      - name: Verify APT packages are installed
        # The cache reports a hit from its own manifest, not from
        # the machine, so a payload-less entry installs nothing
        # and reports success. Ask dpkg instead. See the script.
        run: tools/ci/ensure_apt_packages.sh $APT_PACKAGES

      - name: Cache upstream rsync
        id: cache-rsync
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/interop/upstream-src
            target/interop/upstream-install
          key: upstream-rsync-${{ inputs.upstream_rsync_version }}-${{ runner.os }}-${{ hashFiles('tools/ci/run_interop.sh') }}
          restore-keys: |
            upstream-rsync-${{ inputs.upstream_rsync_version }}-${{ runner.os }}-

      - name: Fetch upstream rsync tarballs
        if: steps.cache-rsync.outputs.cache-hit != 'true'
        uses: ./.github/actions/fetch-upstream-rsync
        with:
          versions: '2.6.3 2.6.9 3.0.9 3.1.3 3.4.4 3.5.0 3.5.1'

      - name: Build upstream rsync
        if: steps.cache-rsync.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          echo "Building upstream rsync ${{ inputs.upstream_rsync_version }}..."
          bash tools/ci/run_interop.sh build-only

      - name: Set up SSH loopback
        run: |
          sudo systemctl start ssh
          mkdir -p ~/.ssh
          ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519 -N ""
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          ssh -o StrictHostKeyChecking=no localhost true

      - name: Install cargo-nextest
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-nextest

      # The upstream_compat oracle cells below spawn the oc-rsync binary through
      # the test-support resolver, which only looks in the profile directory
      # Cargo baked in. The `-p bin` cells link the binary as a side effect of
      # their own build, but the `-p transfer` MSG_NO_SEND cell does not, so
      # build it once here first. Keeps the interop job covered under the
      # bin-build-coverage guard.
      - name: Build oc-rsync (for subprocess integration tests)
        run: cargo build --locked -p bin --bin oc-rsync

      # INC-S1a oracle: oc sender vs the real upstream 3.5.1 receiver under
      # INC_RECURSE. Gated on OC_RSYNC_UPSTREAM_COMPAT so the standard
      # nextest cells stay upstream-binary-free; this cell has the
      # upstream-install tree built above.
      - name: Run inc_recurse sender oracle (oc sender vs upstream receiver)
        env:
          OC_RSYNC_UPSTREAM_COMPAT: "1"
        run: cargo nextest run --locked --profile ci -p bin -E 'binary(upstream_compat_inc_recurse_sender_oracle)'

      # INC-S1b oracle: a real upstream 3.5.1 sender vs oc as the
      # server-receiver under INC_RECURSE (the receiver-facing twin of the
      # sender oracle above). Encodes oc's CURRENT non-negotiation of
      # CF_INC_RECURSE as its baseline; the assertion flips when #205 enables
      # the receiver arm. Same OC_RSYNC_UPSTREAM_COMPAT gate.
      - name: Run inc_recurse receiver oracle (upstream sender vs oc receiver)
        env:
          OC_RSYNC_UPSTREAM_COMPAT: "1"
        run: cargo nextest run --locked --profile ci -p bin -E 'binary(upstream_compat_inc_recurse_receiver_oracle)'

      # MSG_NO_SEND out-of-order oracle: a real upstream 3.5.0 sender declines a
      # file it cannot open, emitting MSG_NO_SEND for a later NDX while oc's
      # receiver still awaits an earlier one. Pins that oc retires the declined
      # entry by index (io.c:1225 got_flist_entry_status) and lands the readable
      # files instead of aborting the whole transfer as a desync. Same
      # OC_RSYNC_UPSTREAM_COMPAT gate; the 3.5.0 install tree was built above.
      - name: Run MSG_NO_SEND out-of-order oracle (upstream sender vs oc receiver)
        env:
          OC_RSYNC_UPSTREAM_COMPAT: "1"
        run: cargo nextest run --locked --profile ci -p transfer -E 'binary(upstream_compat_no_send_out_of_order)'
      # Delta token oracle: an upstream client pulls the same repeated-block
      # and sparse-image fixtures from an upstream sender and from oc, and the
      # captured sender streams must be byte-identical (match.c hash_search()).
      - name: Run delta token parity oracle (oc sender vs upstream sender)
        env:
          OC_RSYNC_UPSTREAM_COMPAT: "1"
        run: cargo nextest run --locked --profile ci -p test-support -E 'binary(upstream_delta_token_parity)'

      - name: Run interop tests
        run: |
          set -euo pipefail
          mkdir -p target/interop
          bash tools/ci/run_interop.sh 2>&1 | tee target/interop/interop-output.log
          # pipefail ensures the exit code of run_interop.sh propagates

      # RP28.e.2 - daemon-mode interop with rsync 2.6.9 as the client.
      # Inverts the run_interop.sh 2.6.9 daemon cells: oc-rsync runs `--daemon
      # --no-detach` and the 2.6.9 binary issues pulls and pushes against
      # the `[test]` module. Exercises the D1-D10 fixture matrix from
      # `docs/design/rp28-e-1-daemon-2-6-9-client-harness.md` (spec
      # shipped in RP28.e.1, PR #4928). Reuses the 2.6.9 binary built
      # by the earlier `Build upstream rsync` step under
      # `target/interop/upstream-install/2.6.9/bin/rsync`; if absent we
      # rebuild it via `run_interop.sh build-only` to keep the cell
      # self-sufficient. The harness exits 77 when either binary is
      # missing so the cell becomes a no-op rather than a false failure.
      # Blocking: the pre-30 daemon-sender end-of-transfer stats deadlock is
      # fixed (proto < 30 now emits fixed 4-byte longint stats, matching
      # `write_varlong30`), so the full D1-D10 matrix passes against 2.6.9.
      - name: Run rsync 2.6.9 daemon-mode client interop (RP28.e.2)
        run: |
          set -euo pipefail
          RSYNC_269="target/interop/upstream-install/2.6.9/bin/rsync"
          if [[ ! -x "$RSYNC_269" ]]; then
            echo "rsync 2.6.9 binary missing at $RSYNC_269; building via run_interop.sh build-only" >&2
            bash tools/ci/run_interop.sh build-only
            if [[ ! -x "$RSYNC_269" ]]; then
              echo "rsync 2.6.9 build did not produce $RSYNC_269" >&2
              exit 1
            fi
          fi

          OC_RSYNC="target/release/oc-rsync"
          if [[ ! -x "$OC_RSYNC" ]]; then
            OC_RSYNC="target/dist/oc-rsync"
          fi
          if [[ ! -x "$OC_RSYNC" ]]; then
            echo "oc-rsync binary missing at target/release/oc-rsync and target/dist/oc-rsync" >&2
            exit 1
          fi

          # Outer wall-clock guard: bound total runtime so an unexpected stall in
          # any fixture cannot consume the whole job budget. The harness traps
          # SIGTERM to stop its daemon; a timeout here surfaces as a hard failure.
          timeout --signal=TERM --kill-after=30 360 \
            bash scripts/rp28_e_1_run.sh \
            --oc-rsync "$OC_RSYNC" \
            --rsync-2-6-9 "$RSYNC_269"

      - name: Capture RP28.e.2 daemon log on failure
        if: failure()
        run: |
          if [[ -f /tmp/rp28-e/daemon.log ]]; then
            echo "--- /tmp/rp28-e/daemon.log ---"
            cat /tmp/rp28-e/daemon.log
          else
            echo "no /tmp/rp28-e/daemon.log to capture"
          fi

      # RP28.f.2 - client-mode interop with rsync 2.6.9 as the daemon.
      # Inverse of RP28.e.2: rsync 2.6.9 runs `--daemon --no-detach` on an
      # ephemeral 127.0.0.1 port and oc-rsync issues pulls and pushes
      # against the `[legacy]` module. Exercises the F1-F12 fixture
      # matrix from `docs/design/rp28-f-1-client-2-6-9-daemon-harness.md`
      # (spec shipped in RP28.f.1, PR #4929). Reuses the cached 2.6.9
      # binary published by the RP28.b.3 cache step (PR #4947) under
      # `target/interop/upstream-install/2.6.9/bin/rsync`; falls back to
      # `run_interop.sh build-only` if the cache is cold. The harness
      # exits 77 when either binary is missing so the cell becomes a
      # no-op rather than a false failure. Blocking: the pre-30 stats
      # deadlock that stalled the proto-29 legs is fixed, so the full
      # F1-F12 matrix passes with 2.6.9 as the daemon.
      - name: Run rsync 2.6.9 client-mode daemon interop (RP28.f.2)
        run: |
          set -euo pipefail
          RSYNC_269="target/interop/upstream-install/2.6.9/bin/rsync"
          if [[ ! -x "$RSYNC_269" ]]; then
            echo "rsync 2.6.9 binary missing at $RSYNC_269; building via run_interop.sh build-only" >&2
            bash tools/ci/run_interop.sh build-only
            if [[ ! -x "$RSYNC_269" ]]; then
              echo "rsync 2.6.9 build did not produce $RSYNC_269" >&2
              exit 1
            fi
          fi

          OC_RSYNC="target/release/oc-rsync"
          if [[ ! -x "$OC_RSYNC" ]]; then
            OC_RSYNC="target/dist/oc-rsync"
          fi
          if [[ ! -x "$OC_RSYNC" ]]; then
            echo "oc-rsync binary missing at target/release/oc-rsync and target/dist/oc-rsync" >&2
            exit 1
          fi

          # Outer wall-clock guard (see RP28.e.2 cell): bound total runtime so an
          # unexpected stall in any fixture cannot consume the job budget. The
          # harness traps SIGTERM to stop its daemon; a timeout is a hard failure.
          timeout --signal=TERM --kill-after=30 360 \
            bash scripts/rp28_f_1_run.sh \
            --oc-rsync "$OC_RSYNC" \
            --rsync-2-6-9 "$RSYNC_269"

      - name: Capture RP28.f.2 daemon log on failure
        if: failure()
        run: |
          if [[ -f /tmp/rp28-f/daemon.log ]]; then
            echo "--- /tmp/rp28-f/daemon.log ---"
            cat /tmp/rp28-f/daemon.log
          else
            echo "no /tmp/rp28-f/daemon.log to capture"
          fi

      # NOTE: upstream's own `testsuite/*.test` corpus is deliberately NOT run
      # here. `upstream-testsuite-3.5.1.yml` drives it through
      # `_upstream-testsuite.yml`, which calls the same
      # `tools/ci/run_upstream_testsuite.sh` with the same `OC_RSYNC_BIN`,
      # pinned to the 3.5.1 reference release - but blocking, as the required
      # upstream-testsuite contexts (and their `(root)` variants). A second, `continue-on-error` copy inside this
      # job re-ran an already-required gate and could only ever report a green
      # `interop` context while the suite failed. Add suite coverage there, not
      # here.

      # Exercised against EACH upstream peer we must interoperate with over a
      # real ssh loopback. run_interop.sh already sweeps every version by
      # explicit path, but the push/pull/remote-sender legs below drive the
      # `rsync` on PATH, so they reinstall and re-verify per version. 3.4.4
      # stays (the conservative regression-fix peer), and 3.5.0 and 3.5.1 are
      # added (the releases this project targets); all are built and cached by
      # `run_interop.sh build-only`. Keeping this one job preserves the
      # `interop / interop with upstream rsync` required check as a single gate
      # that reddens if EITHER peer regresses - a per-version job matrix would
      # rename that context and drop the required check.
      - name: Run SSH interop tests
        run: |
          set -euo pipefail
          OC_RSYNC="target/dist/oc-rsync"
          # --rsync-path is resolved by the REMOTE shell, whose cwd is $HOME,
          # so the oc-rsync path handed to upstream has to be absolute.
          OC_RSYNC_ABS="$(pwd)/${OC_RSYNC}"

          # The version ci.yml passes stays the first arm; 3.5.1, 3.5.0 and
          # 3.4.4 are always added. Dedupe so an operator override runs each
          # leg once.
          SSH_INTEROP_VERSIONS="$(printf '%s\n' "${{ inputs.upstream_rsync_version }}" 3.5.1 3.5.0 3.4.4 | awk 'NF && !seen[$0]++' | tr '\n' ' ')"

          run_ssh_interop_for_version() {
            local VER="$1"

            # Install this peer to PATH from the freshly built source tree;
            # fail loud if it is absent rather than silently testing the distro
            # rsync (the banner check below is the second line of defence).
            local UPSTREAM="target/interop/upstream-src/rsync-${VER}/rsync"
            if [ ! -f "$UPSTREAM" ]; then
              echo "upstream rsync ${VER} binary missing at $UPSTREAM" >&2
              exit 1
            fi
            sudo cp "$UPSTREAM" /usr/local/bin/rsync
            hash -r

            local SRC DST DST2 DST3 i
            SRC=$(mktemp -d)
            DST=$(mktemp -d)
            DST2=$(mktemp -d)
            DST3=$(mktemp -d)
            trap 'rm -rf "$SRC" "$DST" "$DST2" "$DST3"' RETURN

            # Create test data
            for i in $(seq 1 10); do
              dd if=/dev/urandom of="$SRC/file_$i.bin" bs=1024 count=10 2>/dev/null
            done
            mkdir -p "$SRC/subdir"
            echo "nested" > "$SRC/subdir/nested.txt"

            # Verify binaries. The upstream peer is only an oracle if it really
            # is the requested version, so assert on the --version banner and
            # never on the path: if the install above found no freshly built
            # binary, `rsync` on PATH is silently the distro build instead.
            local UP_BANNER
            UP_BANNER="$(rsync --version 2>&1 | head -1)"
            echo "=== SSH interop vs upstream rsync ${VER} ==="
            echo "oc-rsync: $($OC_RSYNC --version 2>&1 | head -1)"
            echo "upstream rsync: $UP_BANNER"
            echo "upstream rsync path: $(which rsync)"
            case "$UP_BANNER" in
              "rsync  version ${VER} "*) ;;
              *) echo "expected upstream rsync ${VER} on PATH, got: $UP_BANNER" >&2; exit 1 ;;
            esac

            # Baseline: upstream rsync → upstream rsync via SSH
            echo "=== Baseline: upstream rsync SSH pull ==="
            timeout 60 rsync -av --timeout=30 "localhost:$SRC/" "$DST2/" 2>&1
            diff -r "$SRC" "$DST2"
            echo "PASS: upstream SSH pull baseline"

            # SSH push: oc-rsync client → upstream rsync server
            echo "=== SSH push: oc-rsync → upstream rsync ==="
            timeout 60 "$OC_RSYNC" -av --timeout=30 "$SRC/" "localhost:$DST/" 2>&1 || {
              RC=$?
              echo "SSH push failed with exit $RC"

              # Show oc-rsync diagnostic output (eprintln goes to stderr)
              echo "--- Attempting push with verbose stderr capture ---"
              timeout 60 "$OC_RSYNC" -avvv --timeout=30 "$SRC/" "localhost:$DST/" > /tmp/oc_push_stdout.txt 2>/tmp/oc_push_stderr.txt || true
              echo "=== oc-rsync stderr ==="
              cat /tmp/oc_push_stderr.txt || true
              echo "=== oc-rsync stdout ==="
              cat /tmp/oc_push_stdout.txt || true

              # Diagnostic: manually invoke remote rsync with strace to see what it reads
              echo "--- Remote rsync manual test ---"
              echo "Remote rsync args that oc-rsync would send:"
              "$OC_RSYNC" -av --timeout=30 --dry-run "$SRC/" "localhost:$DST/" 2>&1 | head -5 || true

              # Test: upstream rsync client → upstream rsync server (same args)
              echo "--- Baseline upstream push for comparison ---"
              timeout 60 rsync -av --timeout=30 "$SRC/" "localhost:$DST/" 2>&1 || true

              # Capture what upstream rsync server sees from oc-rsync via raw pipe
              echo "--- Raw protocol capture ---"
              ARGS=$(echo "--server -logDtprv -e.LsfxCIvu . $DST/")
              echo "Remote rsync args: rsync $ARGS"
              # Send oc-rsync's output through a pipe to see what the server gets
              timeout 30 ssh localhost "strace -e trace=read,write -f rsync $ARGS" < /dev/null > /tmp/strace_out.txt 2>&1 || true
              echo "=== strace output (first 100 lines) ==="
              head -100 /tmp/strace_out.txt || true

              exit 1
            }
            diff -r "$SRC" "$DST"
            echo "PASS: SSH push initial sync"

            # SSH pull: oc-rsync client ← upstream rsync server
            rm -rf "$DST"/*
            echo "=== SSH pull: oc-rsync ← upstream rsync ==="
            timeout 60 "$OC_RSYNC" -avvv --timeout=30 "localhost:$SRC/" "$DST/" 2>&1 || {
              RC=$?
              echo "SSH pull failed with exit $RC"

              # Show oc-rsync diagnostic output
              echo "--- Attempting pull with verbose stderr capture ---"
              timeout 60 "$OC_RSYNC" -avvv --timeout=30 "localhost:$SRC/" "$DST/" > /tmp/oc_pull_stdout.txt 2>/tmp/oc_pull_stderr.txt || true
              echo "=== oc-rsync stderr ==="
              cat /tmp/oc_pull_stderr.txt || true
              echo "=== oc-rsync stdout ==="
              cat /tmp/oc_pull_stdout.txt || true

              exit 1
            }
            diff -r "$SRC" "$DST"
            echo "PASS: SSH pull initial sync"

            # SSH pull no-change
            timeout 60 "$OC_RSYNC" -av --timeout=30 "localhost:$SRC/" "$DST/"
            echo "PASS: SSH pull no-change sync"

            # SSH pull with oc-rsync as the REMOTE SENDER: upstream rsync is the
            # client and spawns oc-rsync as `--server --sender` over SSH. Every
            # other SSH leg here runs oc-rsync as the client, so without this one
            # oc-rsync's server-sender wire output has no upstream oracle: an
            # oc<->oc transfer cannot see a divergence that both sides share.
            echo "=== SSH pull: upstream rsync client <- oc-rsync remote sender ==="
            timeout 60 rsync -av --timeout=30 --rsync-path="$OC_RSYNC_ABS" \
              "localhost:$SRC/" "$DST3/" 2>&1
            diff -r "$SRC" "$DST3"
            echo "PASS: SSH pull with oc-rsync as remote sender"

            echo "All SSH interop tests passed for upstream rsync ${VER}."
          }

          for VER in $SSH_INTEROP_VERSIONS; do
            run_ssh_interop_for_version "$VER"
          done

      - name: Regenerate interop compatibility matrix
        if: always()
        run: |
          set -euo pipefail
          LOG="target/interop/interop-output.log"
          if [[ -f "$LOG" ]]; then
            python3 tools/ci/regenerate_interop_matrix.py "$LOG"
            echo "Matrix regenerated from interop log."
          else
            echo "No interop log found; skipping matrix regeneration."
          fi

      - name: Upload interop matrix
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interop-compatibility-matrix
          path: docs/user/interop-compatibility-matrix.md
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload interop log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interop-output-log
          path: target/interop/interop-output.log
          if-no-files-found: ignore
          retention-days: 14

