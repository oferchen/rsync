name: Upstream Testsuite (macOS)

# Reusable workflow: the upstream rsync 3.5.0 Python testsuite on macOS.
#
# WHY A SEPARATE WORKFLOW RATHER THAN A `runs-on` INPUT ON
# `_upstream-testsuite.yml`
# ---------------------------------------------------------------------------
# The shared runner script `tools/ci/run_upstream_testsuite.sh` IS
# platform-agnostic - it carries only three Linux-isms, each of which degrades
# safely on macOS (`mountpoint`/`/proc/mounts` probing behind a `command -v`
# guard, and a tmpfs concern in `world_traversable_scratch_base()` that is
# explicitly scoped to root-on-Linux). That script is the shared piece and this
# workflow reuses it verbatim.
#
# The WORKFLOW is the part that is not portable. `_upstream-testsuite.yml`'s job
# body is Linux-shaped throughout: the `APT_PACKAGES` env, two
# `cache-apt-pkgs-action` steps, two `ensure_apt_packages.sh` verifications, and
# a `sudo env` re-exec for the root leg. Threading a `runs-on` input through it
# would mean guarding every one of those steps on the platform. It also carries
# ten REQUIRED status contexts, so a mistake there breaks gates that have
# nothing to do with macOS. Duplicating ~60 lines of YAML is the cheaper and
# safer half of that trade.
#
# WHAT THIS LEG BUYS (counted from the committed manifests, not transcribed:
# `awk '!/^#/ && NF {c[$NF]++} END {...}' tools/ci/upstream-3.5.0-expect.*.txt`)
# ---------------------------------------------------------------------------
# 238 passed / 2 failed / 105 skipped, against 260 / 0 / 85 for the Linux
# nonroot/pipe leg. NEITHER failure is shared with Linux - both are
# divergences no other required context can observe:
#
#   chmod-setid                                      (passes on Linux)
#   partial-protected-regular-retry-policy           (SKIPS on Linux)
#
# The two legs previously shared `filter-merge-content-echo`; it is fixed and
# now `pass` everywhere, which is why this leg is the ONLY one that can still
# observe a failing cell at all.
#
# The leg opened at 10 failures; seven have since been fixed, each in its own
# PR (#7654, #7655, #7656, #7659 and the pipe-leg work before them). Two cells
# that SKIP on Linux now PASS here, so this leg is the only place they have
# ever run.
#
# None of the three appears in upstream's own `testsuite/skiplist/macos.txt`,
# so none is a platform artefact upstream itself waives. `chmod-setid` is the
# one cell where the real rsync 3.5.0 binary lands on the same outcome on this
# runner class, so it is recorded `fail` rather than re-baselined away.
#
# COVERAGE THIS LEG DOES *NOT* BUY
# ---------------------------------------------------------------------------
# 23 cells skip here that run on Linux. Twenty are exactly upstream's own
# macos.txt entries (acls-*, sparse, preallocate, simd-checksum, rrsync-*, ...)
# and three (chown, devices, daemon-namecvt-empty-response) are privilege-keyed.
# So the leg produces ~240 real outcomes, not 345 - do not read the row count as
# the coverage figure.
#
# NON-ROOT ONLY - AND THAT IS NOW A KNOWN GAP, NOT A DESIGN CHOICE
# ---------------------------------------------------------------------------
# This file used to argue that a root leg "would run the same 240 outcomes at
# twice the cost", on the grounds that the cells it unlocks are chown/devices/
# dir-sgid - all either in upstream's macos.txt skip set or privilege-keyed
# away. That reasoning does not survive the count.
#
# Crossing the committed manifests (root runs / nonroot skips on Linux, minus
# upstream's macos.txt waivers) puts 29 cells in the set a macOS root leg would
# newly RUN, and only 3 of the 32 privilege-keyed cells are upstream-waived.
# They are not chown/devices: the set is dominated by the symlink-race and
# confinement family - backup-dir-symlink-race, symlink-race-dest,
# temp-dir-symlink-injection, daemon-module-chdir-symlink,
# operator-path-backup-symlink, and all five chroot-*-inner-module.
#
# That is exactly the family whose Linux passes are known to rest on Landlock
# rather than on the userspace confinement guard, so a platform without
# Landlock is the only place the guard is tested unaided. A macOS root leg is
# therefore the missing instrument, not a redundant one.
#
# It is NOT added here yet, for a reason worth stating: the 29 is a PREDICTION
# derived from the Linux manifests, and the equivalent prediction for the tcp
# leg below overshot (52 predicted, 32 measured) because cells can skip on
# macOS for platform reasons the Linux manifests cannot show. A root manifest
# must come from an executed macOS root run - dispatch this workflow with a
# root variant and take the EMIT_EXPECT_RESULT artifact - never from the
# prediction.

on:
  workflow_call:
    inputs:
      cache_version:
        description: 'Cache version for invalidation'
        type: string
        default: 'v1'
      upstream_rsync_version:
        description: 'Upstream rsync version to build and test against'
        type: string
        default: '3.5.0'
      transport:
        description: >-
          `pipe` (upstream's secure default: a stdio socketpair, no listening
          socket) or `tcp` (a real rsyncd bound to 127.0.0.1). `tcp` also passes
          --daemon-tests-only, the pairing upstream ships the option for: the
          tests it drops never call start_test_daemon(), so they cannot observe
          the transport and would only repeat the pipe leg. Mirrors the input of
          the same name on `_upstream-testsuite.yml`.
        type: string
        default: 'pipe'
      variant:
        description: >-
          Which privilege leg(s) to run: `all` | `nonroot` | `root`. The root
          leg re-execs the harness under sudo so the privilege-keyed cells
          (chown, devices, dir-sgid, and the symlink-race/confinement family)
          RUN instead of skipping. It is a separate job rather than a step
          conditional for the same reason it is on `_upstream-testsuite.yml`:
          the sudo re-exec is the whole difference, and a job boundary keeps
          each leg's conclusion its own.

          Defaults to `all`, matching `_upstream-testsuite.yml`: ONE caller runs
          BOTH legs and publishes one check per leg. Pinning a single variant
          per caller instead would make the deselected job report a permanently
          SKIPPED check on every PR - four of them across the two transports.
        type: string
        default: 'all'
      expect_result_macos:
        description: >-
          Path to the per-leg expected-outcome manifest. ONLY the tests it names
          run, and every outcome must match - an unexpected PASS included - so
          the file is the coverage set as well as the oracle. Each transport
          selects a different test set, so each carries its OWN manifest; a
          shared file would fail the driver's coverage guard.
        type: string
        default: 'tools/ci/upstream-3.5.0-expect.macos.nonroot.txt'
      expect_result_macos_root:
        description: >-
          The root leg's manifest, same contract as `expect_result_macos`.

          Both committed files were GENERATED by an executed run of the leg they
          describe, never predicted from the Linux legs - that prediction was
          measured wrong on the tcp leg (52 cells predicted, 32 run). Setting
          this input to the empty string re-enters that bootstrap: the whole
          corpus runs and EMIT_EXPECT_RESULT writes the manifest as an artifact,
          which is how a NEW leg obtains its first one.
        type: string
        default: 'tools/ci/upstream-3.5.0-expect.macos.root.txt'
      timeout_minutes:
        description: 'Job timeout in minutes'
        type: number
        default: 60

permissions:
  contents: read

jobs:
  upstream-testsuite-macos:
    # A literal, not an expression, for the same reason as the Linux legs: a job
    # skipped by an `if:` reports the raw expression text as its name, which
    # would break the status context this job publishes.
    name: upstream testsuite (macOS)
    if: ${{ inputs.variant == 'all' || inputs.variant == 'nonroot' }}
    runs-on: macos-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}

    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-D warnings"
      RUST_BACKTRACE: "full"
      CACHE_VERSION: ${{ inputs.cache_version }}
      UPSTREAM_RSYNC_VERSION: ${{ inputs.upstream_rsync_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the upstream testsuite environment
        uses: ./.github/actions/upstream-testsuite-macos-setup
        with:
          cache_version: ${{ env.CACHE_VERSION }}
          upstream_rsync_version: ${{ env.UPSTREAM_RSYNC_VERSION }}
          rust_cache_key: upstream-testsuite-macos

      - name: Run upstream testsuite
        id: testsuite
        env:
          OC_RSYNC_BIN: target/release/oc-rsync
          UPSTREAM_VERSION: ${{ env.UPSTREAM_RSYNC_VERSION }}
          # Scoped to THIS step so upstream's ./configure finds the Homebrew
          # headers without the Rust build having seen them - see the step that
          # computes these.
          CPPFLAGS: ${{ env.UPSTREAM_CPPFLAGS }}
          LDFLAGS: ${{ env.UPSTREAM_LDFLAGS }}
          EXPECT_RESULT: ${{ inputs.expect_result_macos }}
          # `yes` only on the tcp leg; the driver refuses DAEMON_TESTS_ONLY
          # without USE_TCP, so the two move together by construction.
          USE_TCP: ${{ inputs.transport == 'tcp' && 'yes' || '' }}
          DAEMON_TESTS_ONLY: ${{ inputs.transport == 'tcp' && 'yes' || '' }}
          # Always emit the manifest this run would hold itself to, for the same
          # reason the Linux legs do: hand-curating the ledger is exactly how it
          # drifts, and because --expect-result runs ONLY the tests it names,
          # that drift shrinks coverage silently instead of failing. Uploaded as
          # an artifact so a re-baseline is a reviewable diff of outcomes.
          # Transport-scoped: both legs upload into the same artifact namespace,
          # and one name would let the second leg overwrite the first - leaving a
          # re-baseline diffing the wrong leg's outcomes.
          EMIT_EXPECT_RESULT: target/interop/expect-result.macos.nonroot.${{ inputs.transport }}.txt
        run: |
          set -euo pipefail
          mkdir -p target/interop
          bash tools/ci/run_upstream_testsuite.sh 2>&1 | tee target/interop/upstream-testsuite-output.log
        # No step-level continue-on-error: an UNEXPECTED FAIL or an unexpected
        # PASS must reach the job conclusion, or the leg is decorative.

      - name: Generate job summary
        if: always()
        run: |
          bash tools/ci/summarize_upstream_testsuite.sh \
            target/interop/upstream-testsuite-output.log \
            "Upstream Testsuite Results (macOS)"

      - name: Upload testsuite logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Transport-scoped, like the emitted manifest itself: an artifact name
          # is unique per RUN, not per job, so two legs sharing one name is an
          # upload collision - the second would fail or clobber the first, and a
          # re-baseline would then be diffing the wrong leg.
          name: upstream-testsuite-logs-macos-${{ inputs.transport }}
          path: |
            target/interop/upstream-testsuite/
            target/interop/upstream-testsuite-output.log
            target/interop/expect-result.macos.nonroot.${{ inputs.transport }}.txt
          if-no-files-found: ignore
          retention-days: 14

  # Root leg. macOS runners grant passwordless sudo, so the privilege-keyed
  # cells that SKIP on the non-root leg actually run here.
  #
  # WHY THIS EXISTS AT ALL - and why the figure below is not a justification
  # ---------------------------------------------------------------------------
  # Crossing the committed Linux manifests puts ~29 cells in the set a macOS
  # root leg would newly RUN, dominated NOT by chown/devices but by the
  # symlink-race and confinement family: backup-dir-symlink-race,
  # symlink-race-dest, temp-dir-symlink-injection, daemon-module-chdir-symlink,
  # operator-path-backup-symlink, and all five chroot-*-inner-module. Those are
  # exactly the cells whose Linux passes are known to rest on Landlock rather
  # than on the userspace confinement guard (task 1137 measured the guard
  # failing on BOTH platforms under a symlinked ancestor), so a platform
  # without Landlock is the only place the guard is exercised unaided.
  #
  # The ~29 is a PREDICTION and is recorded as one. The equivalent prediction
  # for the tcp leg said 52 and the executed run gave 32, because cells skip on
  # macOS for platform reasons the Linux manifests cannot express. The manifest
  # therefore comes from an executed run of THIS job, never from the crossing.
  upstream-testsuite-macos-root:
    # A literal, like its sibling: a job skipped by `if:` reports the raw
    # expression text as its name, so an expression here would rename the
    # check context whenever the leg is deselected.
    name: upstream testsuite (macOS, root)
    if: ${{ inputs.variant == 'all' || inputs.variant == 'root' }}
    runs-on: macos-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}

    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-D warnings"
      RUST_BACKTRACE: "full"
      CACHE_VERSION: ${{ inputs.cache_version }}
      UPSTREAM_RSYNC_VERSION: ${{ inputs.upstream_rsync_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the upstream testsuite environment
        uses: ./.github/actions/upstream-testsuite-macos-setup
        with:
          cache_version: ${{ env.CACHE_VERSION }}
          upstream_rsync_version: ${{ env.UPSTREAM_RSYNC_VERSION }}
          rust_cache_key: upstream-testsuite-macos-root

      - name: Run upstream testsuite (root)
        id: testsuite
        env:
          OC_RSYNC_BIN: target/release/oc-rsync
          UPSTREAM_VERSION: ${{ env.UPSTREAM_RSYNC_VERSION }}
          CPPFLAGS: ${{ env.UPSTREAM_CPPFLAGS }}
          LDFLAGS: ${{ env.UPSTREAM_LDFLAGS }}
          EXPECT_RESULT: ${{ inputs.expect_result_macos_root }}
          USE_TCP: ${{ inputs.transport == 'tcp' && 'yes' || '' }}
          DAEMON_TESTS_ONLY: ${{ inputs.transport == 'tcp' && 'yes' || '' }}
          EMIT_EXPECT_RESULT: target/interop/expect-result.macos.root.${{ inputs.transport }}.txt
        run: |
          set -euo pipefail
          mkdir -p target/interop
          # Passwordless sudo re-exec so the root-only cells RUN. The env is
          # forwarded explicitly because a bare `sudo` scrubs it, which would
          # silently drop the manifest, the binary path and the Homebrew
          # include flags - the last of which would rebuild upstream WITHOUT
          # openssl/xxhash and quietly change the oracle.
          sudo env \
            OC_RSYNC_BIN="$OC_RSYNC_BIN" \
            UPSTREAM_VERSION="$UPSTREAM_VERSION" \
            CPPFLAGS="$CPPFLAGS" \
            LDFLAGS="$LDFLAGS" \
            EXPECT_RESULT="$EXPECT_RESULT" \
            USE_TCP="$USE_TCP" \
            DAEMON_TESTS_ONLY="$DAEMON_TESTS_ONLY" \
            EMIT_EXPECT_RESULT="$EMIT_EXPECT_RESULT" \
            GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" \
            bash tools/ci/run_upstream_testsuite.sh 2>&1 \
            | tee target/interop/upstream-testsuite-root-output.log

          # Reclaim root-owned scratch so the upload and the post-job cache can
          # read it.
          sudo chown -R "$(id -u):$(id -g)" target/interop 2>/dev/null || true
        # No continue-on-error, for the same reason as the non-root leg: a
        # root-only regression must reach the job conclusion.

      - name: Generate job summary
        if: always()
        run: |
          bash tools/ci/summarize_upstream_testsuite.sh \
            target/interop/upstream-testsuite-root-output.log \
            "Upstream Testsuite Results (macOS, root)"

      - name: Upload testsuite logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Scoped by BOTH axes: artifact names are unique per run, not per job,
          # so nonroot/root and pipe/tcp must all differ or one leg clobbers
          # another and a re-baseline diffs the wrong outcomes.
          name: upstream-testsuite-logs-macos-root-${{ inputs.transport }}
          path: |
            target/interop/upstream-testsuite/
            target/interop/upstream-testsuite-root-output.log
            target/interop/expect-result.macos.root.${{ inputs.transport }}.txt
          if-no-files-found: ignore
          retention-days: 14
