name: Upstream Testsuite 3.5.1

# Nightly run of all eight rsync 3.5.1 testsuite legs on master:
# {Linux, macOS} x {non-root, root} x {pipe, loopback tcp}, with one aggregate
# README badge. All legs call the SAME reusable workflows the 3.5.0 legs use,
# with only the version and manifest changed.
#
# NOT A PULL-REQUEST OR PUSH GATE, deliberately. CI runs about one workflow at
# a time, and eight more legs per pull request or per merge would starve the
# required checks. The legs run nightly and on demand; the 3.5.0 legs in ci.yml
# stay the required gate until the pin flip retires them.
#
# Every manifest row is GENERATED from an executed run (EMIT_EXPECT_RESULT),
# and every `fail` row carries its cause and owning task inline. runtests.py
# compares outcomes exactly - an unexpected PASS fails the leg too - so a cell
# fixed by its owner turns this red until its row is flipped to `pass`.
#
# `bootstrap: true` runs every leg WITHOUT a manifest and uploads the manifest
# each would hold itself to (expect-result.*.txt in its logs artifact); that is
# how a re-baseline is taken.
#
# The job names are distinct from ci.yml's 3.5.0 callers, so no context
# reported here can satisfy - or be mistaken for - a required check.
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      bootstrap:
        description: 'Run without a manifest and emit a fresh one as an artifact'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: upstream-testsuite-3.5.1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: 3.5.1 Linux ${{ matrix.variant }} ${{ matrix.transport }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { variant: nonroot, transport: pipe, manifest: tools/ci/upstream-3.5.1-expect.nonroot.txt }
          - { variant: root, transport: pipe, manifest: tools/ci/upstream-3.5.1-expect.root.txt }
          - { variant: nonroot, transport: tcp, manifest: tools/ci/upstream-3.5.1-expect.nonroot.tcp.txt }
          - { variant: root, transport: tcp, manifest: tools/ci/upstream-3.5.1-expect.root.tcp.txt }
    uses: ./.github/workflows/_upstream-testsuite.yml
    with:
      cache_version: ${{ vars.CACHE_VERSION || 'v1' }}
      upstream_rsync_version: '3.5.1'
      variant: ${{ matrix.variant }}
      transport: ${{ matrix.transport }}
      # `!bootstrap && ... && path || ''`, never `bootstrap && '' || path`: an
      # empty string is falsy, so the second form would always yield the path.
      expect_result_nonroot: ${{ !inputs.bootstrap && matrix.variant == 'nonroot' && matrix.manifest || '' }}
      expect_result_root: ${{ !inputs.bootstrap && matrix.variant == 'root' && matrix.manifest || '' }}

  macos:
    name: 3.5.1 macOS ${{ matrix.variant }} ${{ matrix.transport }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { variant: nonroot, transport: pipe, manifest: tools/ci/upstream-3.5.1-expect.macos.nonroot.txt }
          - { variant: root, transport: pipe, manifest: tools/ci/upstream-3.5.1-expect.macos.root.txt }
          - { variant: nonroot, transport: tcp, manifest: tools/ci/upstream-3.5.1-expect.macos.nonroot.tcp.txt }
          - { variant: root, transport: tcp, manifest: tools/ci/upstream-3.5.1-expect.macos.root.tcp.txt }
    uses: ./.github/workflows/_upstream-testsuite-macos.yml
    with:
      cache_version: ${{ vars.CACHE_VERSION || 'v1' }}
      upstream_rsync_version: '3.5.1'
      variant: ${{ matrix.variant }}
      transport: ${{ matrix.transport }}
      expect_result_macos: ${{ !inputs.bootstrap && matrix.variant == 'nonroot' && matrix.manifest || '' }}
      expect_result_macos_root: ${{ !inputs.bootstrap && matrix.variant == 'root' && matrix.manifest || '' }}
