name: Upstream Testsuite 3.5.1

# The upstream rsync 3.5.1 Python testsuite against oc-rsync, on all eight
# contexts: {pipe,tcp} x {nonroot,root} x {Linux,macOS}.
#
#            | pipe (secure default) | tcp (--use-tcp --daemon-tests-only)
#   ---------+-----------------------+------------------------------------
#   Linux    | linux-pipe (nr, root) | linux-tcp (nr, root)
#   macOS    | macos-pipe (nr, root) | macos-tcp (nr, root)
#
# Each job calls the SAME reusable workflows the 3.5.0 legs use, with only the
# version and the manifests changed - there is no second copy of the leg logic.
# Each call runs both privilege jobs (variant `all`), so 4 calls = 8 contexts.
#
# NOT A PULL-REQUEST GATE, deliberately. CI runs about one workflow at a time,
# and eight more jobs on every PR would gridlock the merge queue. This runs on
# push to master, nightly and on demand; the 3.5.0 legs in ci.yml stay the
# required gate until the pin flip (U351-2c/2e) retires them.
#
# Every manifest row is GENERATED from an executed run (EMIT_EXPECT_RESULT),
# and every `fail` row carries its cause and owning task inline. runtests.py
# compares outcomes exactly - an unexpected PASS fails the leg too - so a cell
# fixed by its owner turns this red until its row is flipped to `pass`: the
# ledger can only shrink deliberately.
#
# `bootstrap: true` runs every leg WITHOUT a manifest: the whole corpus runs,
# any failure reddens the leg, and each job uploads the manifest it would hold
# itself to (expect-result.*.txt in its logs artifact). That is how the
# manifests below were obtained, and how a re-baseline is taken.
on:
  push:
    branches: [master, ci/uts-351-legs]
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      bootstrap:
        description: 'Run without manifests and emit fresh ones as artifacts'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: upstream-testsuite-3.5.1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job ids are distinct from ci.yml's 3.5.0 callers, so no context reported
  # here can satisfy - or be mistaken for - a required 3.5.0 check.
  linux-pipe:
    uses: ./.github/workflows/_upstream-testsuite.yml
    with:
      cache_version: ${{ vars.CACHE_VERSION || 'v1' }}
      upstream_rsync_version: '3.5.1'
      transport: 'pipe'
      # `!bootstrap && path || ''`, never `bootstrap && '' || path`: an empty
      # string is falsy, so the second form would always yield the path.
      expect_result_nonroot: ${{ !inputs.bootstrap && 'tools/ci/upstream-3.5.1-expect.nonroot.txt' || '' }}
      expect_result_root: ${{ !inputs.bootstrap && 'tools/ci/upstream-3.5.1-expect.root.txt' || '' }}

  linux-tcp:
    uses: ./.github/workflows/_upstream-testsuite.yml
    with:
      cache_version: ${{ vars.CACHE_VERSION || 'v1' }}
      upstream_rsync_version: '3.5.1'
      transport: 'tcp'
      expect_result_nonroot: ${{ !inputs.bootstrap && 'tools/ci/upstream-3.5.1-expect.nonroot.tcp.txt' || '' }}
      expect_result_root: ${{ !inputs.bootstrap && 'tools/ci/upstream-3.5.1-expect.root.tcp.txt' || '' }}

  macos-pipe:
    uses: ./.github/workflows/_upstream-testsuite-macos.yml
    with:
      cache_version: ${{ vars.CACHE_VERSION || 'v1' }}
      upstream_rsync_version: '3.5.1'
      transport: 'pipe'
      expect_result_macos: ${{ !inputs.bootstrap && 'tools/ci/upstream-3.5.1-expect.macos.nonroot.txt' || '' }}
      expect_result_macos_root: ${{ !inputs.bootstrap && 'tools/ci/upstream-3.5.1-expect.macos.root.txt' || '' }}

  macos-tcp:
    uses: ./.github/workflows/_upstream-testsuite-macos.yml
    with:
      cache_version: ${{ vars.CACHE_VERSION || 'v1' }}
      upstream_rsync_version: '3.5.1'
      transport: 'tcp'
      expect_result_macos: ${{ !inputs.bootstrap && 'tools/ci/upstream-3.5.1-expect.macos.nonroot.tcp.txt' || '' }}
      expect_result_macos_root: ${{ !inputs.bootstrap && 'tools/ci/upstream-3.5.1-expect.macos.root.tcp.txt' || '' }}
