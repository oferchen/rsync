name: Upstream tarball cache

# The single producer of the upstream rsync tarball cache entry that every
# fetch-upstream-rsync consumer restores. Runs when the pins or the fetch
# mechanism change, so the key is filled once per manifest rather than raced
# by parallel consumer jobs. A push to master stores it where every branch can
# read it; a pull request that changes the pins stores it for that PR's ref.

on:
  push:
    branches: [ master ]
    paths:
      - 'tools/ci/upstream-tarballs.sha256'
      - 'tools/ci/fetch_upstream_rsync.sh'
      - '.github/actions/fetch-upstream-rsync/**'
      - '.github/workflows/upstream-tarballs.yml'
  pull_request:
    paths:
      - 'tools/ci/upstream-tarballs.sha256'
      - 'tools/ci/fetch_upstream_rsync.sh'
      - '.github/actions/fetch-upstream-rsync/**'
      - '.github/workflows/upstream-tarballs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pull requests wait in two first-in-first-out lanes per workflow, chosen by
  # pull request number parity, so two pull requests' runs share the runner
  # pool and each lane starts its next run only when the previous one has
  # finished; nothing is cancelled. Every other event (master push, schedule,
  # dispatch) gets its own group per commit, so it never waits behind a lane and
  # every merge commit keeps a completed run for bisection.
  group: upstream-tarballs-${{ github.event_name == 'pull_request' && format('pr-queue-{0}', (endsWith(github.event.pull_request.number, '0') || endsWith(github.event.pull_request.number, '2') || endsWith(github.event.pull_request.number, '4') || endsWith(github.event.pull_request.number, '6') || endsWith(github.event.pull_request.number, '8')) && 'even' || 'odd') || format('{0}-{1}', github.ref, github.sha) }}
  queue: max

jobs:
  warm:
    name: Warm upstream tarball cache
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch, verify and save every pinned tarball
        uses: ./.github/actions/fetch-upstream-rsync
        with:
          versions: all
