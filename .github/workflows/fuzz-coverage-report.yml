# Daily Fuzz Sweep
#
# Fuzzes every cargo-fuzz target in the three fuzz workspaces (`fuzz/`,
# `crates/protocol/fuzz/`, `crates/filters/fuzz/`) once a day, then replays the
# resulting corpus under `cargo fuzz coverage` and uploads one `.lcov` per
# target.
#
# Target list:
#   - Built by `tools/ci/fuzz_target_matrix.py` from the workspaces'
#     `[[bin]]` tables, so a new target is swept without a workflow edit.
#   - Targets the overnight workflows already fuzz for 30-60 minutes
#     (differential-fuzzer-overnight.yml, filter-fuzzer-overnight.yml) are
#     left out; the script reads their matrices to find them.
#   - Targets are grouped per workspace into shards of at most 8. A shard
#     builds its workspace once and runs its targets in series.
#
# Budget:
#   - FUZZ_DURATION seconds per target (default 120). 31 targets x 120 s is
#     62 minutes of fuzzing a day, spread over 5 shards of at most 16
#     minutes each. Setup, the sanitizer build and the coverage build add
#     roughly 10 minutes per shard (the coverage build alone measured 2m42s
#     on the fuzz/ workspace with a warm cache).
#   - The overnight differential targets keep their longer budgets; this
#     sweep is for breadth, so every target sees new inputs every day.
#
# Failure policy:
#   - A crash, sanitizer report, timeout or OOM fails the shard and uploads
#     `<workspace>/artifacts/` so the reproducer is kept. Remaining targets in
#     the shard still run, so one finding does not hide another.
#   - An empty committed corpus is fine: the fuzzer creates the inputs that
#     the coverage replay then reads.

name: Fuzz Daily Sweep

on:
  schedule:
    # Daily at 03:30 UTC: after Filter Fuzzer Overnight (02:00 UTC) so the
    # two jobs do not compete for the same fuzz workspace lock.
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      duration:
        description: 'Seconds per fuzz target (default 120)'
        required: false
        default: '120'

concurrency:
  group: fuzz-coverage-report
  cancel-in-progress: false

permissions:
  contents: read

env:
  APT_PACKAGES: build-essential pkg-config zlib1g-dev curl autoconf automake libtool libacl1-dev libattr1-dev lcov libidn2-dev
  CARGO_TERM_COLOR: always
  FUZZ_DURATION: ${{ github.event.inputs.duration || '120' }}

jobs:
  plan:
    name: Plan fuzz shards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: List fuzz targets
        id: plan
        run: |
          set -euo pipefail
          matrix=$(python3 tools/ci/fuzz_target_matrix.py)
          echo "matrix=${matrix}" >>"$GITHUB_OUTPUT"
          echo "${matrix}" | python3 -m json.tool

  fuzz:
    name: ${{ matrix.shard }}
    needs: plan
    runs-on: ubuntu-latest
    # At most 8 targets x 120 s of fuzzing, plus setup, the sanitizer build and
    # the coverage build.
    timeout-minutes: 60
    env:
      TARGETS: ${{ matrix.targets }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          toolchain: stable

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          toolchain: nightly
          components: llvm-tools-preview

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          shared-key: ci-${{ runner.os }}-cargo-v1-${{ hashFiles('**/Cargo.lock') }}
          key: fuzz-sweep-${{ matrix.shard }}

      - name: Cache APT packages
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: ${{ env.APT_PACKAGES }}
          version: v1

      - name: Verify APT packages are installed
        # The cache reports a hit from its own manifest, not from
        # the machine, so a payload-less entry installs nothing
        # and reports success. Ask dpkg instead. See the script.
        run: tools/ci/ensure_apt_packages.sh $APT_PACKAGES

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-fuzz

      - name: Detect host triple
        id: host
        run: echo "triple=$(rustc -vV | awk '/^host:/ { print $2 }')" >>"$GITHUB_OUTPUT"

      - name: Build fuzz targets
        working-directory: ${{ matrix.workspace }}
        run: cargo +nightly fuzz build --target "${{ steps.host.outputs.triple }}"

      - name: Fuzz targets
        working-directory: ${{ matrix.workspace }}
        run: |
          set -uo pipefail
          if ! [[ "${FUZZ_DURATION}" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::duration must be a positive integer, got '${FUZZ_DURATION}'"
              exit 1
          fi
          failed=()
          for target in ${TARGETS}; do
              echo "::group::fuzz ${target}"
              # The committed corpus/<target>/ seeds the run, if present, and
              # receives every new input. -timeout bounds a single input so
              # one hang cannot eat the shard's budget; it is reported as a
              # finding like a crash.
              if ! cargo +nightly fuzz run "${target}" \
                  --target "${{ steps.host.outputs.triple }}" \
                  -- -max_total_time="${FUZZ_DURATION}" -timeout=60; then
                  failed+=("${target}")
              fi
              echo "::endgroup::"
          done
          if [[ "${#failed[@]}" -gt 0 ]]; then
              echo "::error::fuzz findings in: ${failed[*]} (reproducers in the fuzz-findings artifact)"
              exit 1
          fi

      - name: Replay corpus under coverage
        if: ${{ !cancelled() }}
        working-directory: ${{ matrix.workspace }}
        run: |
          set -uo pipefail
          host_triple="${{ steps.host.outputs.triple }}"
          llvm_cov="$(rustc +nightly --print sysroot)/lib/rustlib/${host_triple}/bin/llvm-cov"
          mkdir -p "${GITHUB_WORKSPACE}/coverage"
          failed=()
          for target in ${TARGETS}; do
              echo "::group::coverage ${target}"
              if ! cargo +nightly fuzz coverage "${target}" --target "${host_triple}"; then
                  failed+=("${target}")
                  echo "::endgroup::"
                  continue
              fi
              # The instrumented binary lives under a coverage/ directory of
              # the target dir; its exact nesting differs across cargo-fuzz
              # releases, so find it rather than hard-code it.
              binary=$(find target -type f -perm -u+x -name "${target}" -path '*/coverage/*' | head -n 1)
              if [[ -z "${binary}" ]] || ! "${llvm_cov}" export --format=lcov \
                  --instr-profile="coverage/${target}/coverage.profdata" "${binary}" \
                  >"${GITHUB_WORKSPACE}/coverage/${target}.lcov"; then
                  failed+=("${target}")
              fi
              echo "::endgroup::"
          done
          if [[ "${#failed[@]}" -gt 0 ]]; then
              echo "::error::coverage replay failed for: ${failed[*]}"
              exit 1
          fi

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          {
              echo "## Fuzz coverage: ${{ matrix.shard }}"
              echo ""
              echo "| Target | Lines found | Lines hit | Line coverage |"
              echo "|--------|-------------|-----------|---------------|"
              for target in ${TARGETS}; do
                  lcov_file="coverage/${target}.lcov"
                  if [[ ! -s "${lcov_file}" ]]; then
                      echo "| ${target} | - | - | no data |"
                      continue
                  fi
                  # LF = lines found, LH = lines hit, summed over source files.
                  lh=$(awk -F: '/^LH:/ { s += $2 } END { print s + 0 }' "${lcov_file}")
                  lf=$(awk -F: '/^LF:/ { s += $2 } END { print s + 0 }' "${lcov_file}")
                  pct=$(awk -v h="${lh}" -v f="${lf}" \
                      'BEGIN { if (f > 0) printf "%.2f%%", (h / f) * 100; else print "n/a" }')
                  echo "| ${target} | ${lf} | ${lh} | ${pct} |"
              done
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Upload fuzz findings
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings-${{ matrix.shard }}-${{ github.run_id }}
          retention-days: 30
          path: ${{ matrix.workspace }}/artifacts/
          if-no-files-found: warn

      - name: Upload lcov artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-coverage-${{ matrix.shard }}-${{ github.run_id }}
          retention-days: 30
          path: coverage/
          if-no-files-found: warn
