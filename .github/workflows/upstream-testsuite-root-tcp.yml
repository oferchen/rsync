name: Upstream Testsuite 3.5.0 (root, tcp)

# The ROOT half of the loopback-TCP leg. See upstream-testsuite-tcp.yml for the
# four-leg table and why this leg runs --daemon-tests-only.
#
# Privilege and transport are orthogonal: the root/non-root split exists because
# the root-only tests (chown/devices/xattrs/dir-sgid/protected-regular) self-skip
# as the runner user, and that is true under either transport. So each of the
# four legs carries its OWN --expect-result manifest - measured, not assumed:
# on the pipe legs 78 of 348 test names already resolve to a different outcome
# between root and non-root.
on:
  workflow_dispatch:
  schedule:
    - cron: '30 7 * * *'

permissions:
  contents: read

concurrency:
  group: upstream-testsuite-root-tcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Reported as `upstream-testsuite-root-tcp / upstream testsuite (root)`.
  upstream-testsuite-root-tcp:
    uses: ./.github/workflows/_upstream-testsuite.yml
    with:
      upstream_rsync_version: '3.5.0'
      variant: 'root'
      transport: 'tcp'
      # This leg's OWN manifest - see `legacy_oracles` below for why it cannot
      # share ci.yml's. GENERATED by an executed run of THIS oracle
      # configuration (129 pass / 12 fail / 14 skip over 155 selected), never
      # predicted from the `off` one.
      expect_result_root: tools/ci/upstream-3.5.0-expect.root.tcp.legacy-oracles.txt
      # The only leg that can run daemon-symlink-escape-matrix (it needs root
      # AND a real TCP peer), and that test takes the expected value of 100 of
      # its 200 cells from a live rsync 3.2.7 daemon when one is on disk and
      # from a hand-written prediction of 3.2.7 when one is not - reporting PASS
      # either way. So this leg builds the archive rather than asserting a
      # prediction, and it is the leg where the change is affordable: nightly,
      # not a required check, and already carrying 26 known failures.
      #
      # LEGACY_ORACLES IS A THIRD MANIFEST AXIS, alongside privilege and
      # transport. MEASURED by diffing this leg's generated manifest against
      # ci.yml's: the two differ on EXACTLY ONE of the 155 rows.
      # daemon-max-alloc-zero stats old_versions/rsync_3.2.7 and calls
      # test_skipped() when it is absent, so it reads `skip` off this archive
      # and `pass` on it. The other two consumers degrade SILENTLY - both report
      # PASS either way - and the diff confirms it: daemon-symlink-escape-matrix
      # holds `fail` and daemon-auth-digest-floor holds `pass` under both.
      #
      # That one row is enough to make a shared file impossible.
      # tools/ci/upstream-3.5.0-expect.root.tcp.txt is ALSO ci.yml's PR caller's
      # manifest, and that caller takes the default `off`, where the row is
      # `skip`. runtests.py compares outcomes exactly - _cls() folds only
      # fail/xfail together, never pass into skip (3.5.0 runtests.py:852-859) -
      # so ONE file cannot satisfy both callers: whichever row it carries, the
      # other leg reports a mismatch. Re-baselining the shared file would move
      # the red rather than remove it.
      #
      # Hence a manifest of this leg's own, generated from an executed run of
      # THIS oracle configuration. A leg that later opts in to `on` needs the
      # same treatment; it is not free.
      legacy_oracles: 'on'
