name: Upstream Testsuite 3.5.0 (root, tcp)

# The ROOT half of the loopback-TCP leg. See upstream-testsuite-tcp.yml for the
# four-leg table and why this leg runs --daemon-tests-only.
#
# Privilege and transport are orthogonal: the root/non-root split exists because
# the root-only tests (chown/devices/xattrs/dir-sgid/protected-regular) self-skip
# as the runner user, and that is true under either transport. So each of the
# four legs carries its OWN --expect-result manifest - measured, not assumed:
# on the pipe legs 78 of 348 test names already resolve to a different outcome
# between root and non-root.
on:
  workflow_dispatch:
  schedule:
    - cron: '30 7 * * *'

permissions:
  contents: read

concurrency:
  group: upstream-testsuite-root-tcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Reported as `upstream-testsuite-root-tcp / upstream testsuite (root)`.
  upstream-testsuite-root-tcp:
    uses: ./.github/workflows/_upstream-testsuite.yml
    with:
      upstream_rsync_version: '3.5.0'
      variant: 'root'
      transport: 'tcp'
      # Shared with ci.yml's tcp caller: both run with the default
      # LEGACY_ORACLES=on, so the (privilege, transport) pair is once again the
      # whole manifest key. This leg is the only one that can run
      # daemon-symlink-escape-matrix (it needs root AND a real TCP peer), and
      # that test takes the expected value of 100 of its 200 cells from a live
      # rsync 3.2.7 daemon when one is on disk and from a hand-written
      # prediction of 3.2.7 when one is not - reporting PASS either way. The
      # built archive is what makes those 100 cells assert against the release
      # rather than the prediction.
      expect_result_root: tools/ci/upstream-3.5.0-expect.root.tcp.txt
