name: CI

on:
  push:
    branches: [ master, main ]
    paths:
      - 'crates/**'
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'xtask/**'
      - 'fuzz/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yml'
      - '.github/actions/**'
      - '.github/workflows/**'
      - 'docker/**'
      - 'Cross.toml'
  # Deliberately UNFILTERED. This workflow declares every required context, so
  # it must run on every pull request or a required check never arrives and the
  # pull request is unmergeable.
  #
  # A `paths` filter here previously left docs-only pull requests uncovered, and
  # the gap was filled by ci-skip.yml, a second workflow declaring the same job
  # names with `echo` bodies under the complementary path list. That does not
  # work: `paths` is an ANY-match over the changed files, so a pull request
  # touching one code file and one docs file matched BOTH filters and published
  # two check runs per required context - one real, one stand-in. Measured on
  # PR #7433: `upstream-testsuite / upstream testsuite (root)` resolved to
  # `failure` from this workflow and `success` from the shim, on one commit.
  #
  # Disjoint path LISTS cannot fix that, because the lists are not what is
  # matched - the changed-file SET is, and one pull request can draw from both.
  # The only property that makes a publisher unique is a unique job name, which
  # tools/ci/check_pr_check_name_uniqueness.py now asserts in the lint job.
  pull_request:
  # Merge-queue validation. This is the workflow that publishes every required
  # context, so without this trigger a merge group would never receive them and
  # would sit unmergeable forever. `merge_group` accepts no `paths` filter, so
  # the full matrix runs for every batch regardless of what it touches - which
  # is the intent: the merge group is the last gate before master.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  schedule:
    # Run nightly to exercise beta/nightly toolchains (not run on PRs)
    - cron: '30 3 * * *'

concurrency:
  group: ci-${{ github.ref }}${{ (github.ref == 'refs/heads/master' || github.event_name == 'merge_group') && format('-{0}', github.sha) || '' }}
  # Superseded pull request pushes still cancel; pushes to master do not, so
  # every merge commit keeps a completed run for bisection. The master
  # exemption lives in the GROUP KEY, not in cancel-in-progress: giving each
  # master commit its own group means there is never an older run in the group
  # to evict, which holds regardless of how the flag is evaluated.
  #
  # Merge groups take the same exemption for a sharper reason: a cancelled
  # merge-group run reports as a FAILED required context, which evicts the whole
  # batch from the queue. Batches must never cancel one another.
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: "full"
  CACHE_VERSION: ${{ vars.CACHE_VERSION || 'v1' }}

jobs:
  # ===========================================================================
  # Lint Job - Fast feedback on formatting and clippy issues
  # ===========================================================================
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Branch protection matches a required status check by NAME alone, so a
      # name declared by two pull_request workflows lets the ruleset be
      # satisfied by whichever run it resolves - including one that did no
      # work. Placed before the toolchain install so it fails in seconds.
      # python3-yaml is installed explicitly rather than assumed present on the
      # runner image, so the gate cannot silently stop running.
      - name: Install PyYAML (required by the check-name uniqueness gate)
        run: sudo apt-get install -y python3-yaml

      - name: Check-run name uniqueness
        run: python3 tools/ci/check_pr_check_name_uniqueness.py

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          shared-key: ci-${{ runner.os }}-cargo-${{ env.CACHE_VERSION }}-${{ hashFiles('**/Cargo.lock') }}

      # Regenerate Cargo.lock against Cargo.toml at job start so workspace
      # metadata bumps that didn't refresh the lockfile don't block CI.
      # Runs in --offline mode so no network fetch is required.
      # continue-on-error: cold rust-cache leaves the registry index
      # unavailable, which causes --offline regen to fail with "no matching
      # package" even when the lockfile is already in sync; the subsequent
      # --locked cargo commands surface any real lockfile mismatch loudly.
      - name: Regenerate Cargo.lock
        run: cargo update --workspace --offline
        continue-on-error: true

      - name: Format check
        run: cargo fmt --all -- --check

      # rustfmt reaches a file only through the `mod` tree, so a file pulled in
      # with `include!("...")` - or referenced by no module at all - is
      # invisible to the step above, which exits 0 no matter how such a file is
      # formatted. This step hands rustfmt every tracked .rs file instead, so
      # coverage does not depend on reproducing rustfmt's own walk.
      - name: Format check (every tracked .rs file)
        run: python3 tools/ci/check_rustfmt_all.py

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features --no-deps

      # BPF-5: Detects BufferPool cap-touching tests that mutate
      # `OC_RSYNC_BUFFER_POOL_*` env vars without `platform::env::EnvGuard`.
      # Runs in warn-only mode until BPF-3 (#2821) closes the existing
      # gap; flip the workflow to strict via `OC_RSYNC_ENVGUARD_LINT_STRICT=1`
      # in a follow-up. EOL plan in `docs/design/bpf-4-envguard-ci-lint-spec.md`.
      - name: Install ripgrep (required by EnvGuard lint)
        run: sudo apt-get install -y ripgrep

      - name: EnvGuard lint (BPF-5)
        run: bash tools/ci/check_envguard.sh

      # IUR-6.c: Prevent reintroduction of Arc<Mutex<IoUring>> serialization
      # in hot-path io_uring factory modules. The per-thread ring migration
      # (IUR-3) eliminated this bottleneck; this lint keeps it gone.
      - name: Shared-ring removal guard (IUR-6.c)
        run: bash tools/ci/check_shared_ring_removal.sh

      # A daemon started from a test with detach enabled forks, and the parent -
      # the test process - exits 0 before any assertion runs, so the test passes
      # without proving anything. This lint keeps the foreground guard in the
      # daemon test support module intact and stops the bypasses from regrowing.
      - name: Daemon no-detach guard
        run: bash tools/ci/check_daemon_no_detach.sh

  # ===========================================================================
  # Fuzz Workspace Check - compile-gate the excluded fuzz workspaces
  # ---------------------------------------------------------------------------
  # The fuzz workspaces (fuzz/, crates/protocol/fuzz/, crates/filters/fuzz/)
  # are excluded from the root workspace so libfuzzer-sys never enters
  # ordinary builds. That exclusion also hides breakage from every PR gate:
  # API drift in a main workspace crate can break a fuzz target and stay
  # invisible until a scheduled fuzz workflow runs. This job runs a plain
  # `cargo check` + `cargo fmt --check` per fuzz workspace on stable - no
  # fuzzing, no nightly, no libFuzzer link - so the PR that introduces the
  # drift fails, not the next overnight fuzz run. Runs in its own job rather
  # than inside `lint` because it compiles workspace crates into three
  # separate fuzz target dirs; expected wall time is ~5 minutes cold and
  # ~2 minutes with a warm cache.
  # ===========================================================================
  fuzz-workspace-check:
    name: fuzz workspaces check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          components: rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          shared-key: fuzz-check-${{ runner.os }}-cargo-${{ env.CACHE_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          workspaces: |
            fuzz
            crates/protocol/fuzz
            crates/filters/fuzz

      - name: Check fuzz workspaces
        run: bash tools/ci/check_fuzz_workspaces.sh

  # ===========================================================================
  # Unsafe SAFETY Comment Audit - Informational (non-blocking) check
  # ---------------------------------------------------------------------------
  # Runs `tools/audit/unsafe_safety_comment_audit.py` to surface `unsafe { ... }`
  # blocks that lack a SAFETY justification or whose justification is a
  # placeholder (TODO/FIXME/empty). Marked `continue-on-error: true` while the
  # outstanding `fast_io` and `checksums` violations documented in
  # `docs/audits/unsafe-safety-comment-audit.md` are being addressed. Promote to
  # a required check once the violation count reaches zero (or a documented
  # threshold) and the script exits non-zero on regression.
  # ===========================================================================
  unsafe-safety-comment-audit:
    name: unsafe-safety-comment-audit (informational)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    timeout-minutes: 5
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run unsafe SAFETY comment audit
        run: python3 tools/audit/unsafe_safety_comment_audit.py

  # ===========================================================================
  # Rustdoc Intra-Doc Links
  # ---------------------------------------------------------------------------
  # `cargo doc` ran in exactly one place - pages.yml, on `push: branches:
  # [master]` - so a broken intra-doc link was discoverable only after it
  # landed and reddened master. Four PRs (#7264, #7489, #7555, #7618) repaired
  # the same class post-merge before this job existed.
  #
  # The invocation mirrors pages.yml exactly, including RUSTDOCFLAGS: matching
  # it is the whole point, since a divergent flag set would gate a different
  # question than the one Pages asks. `crates/fast_io/src/io_uring` is
  # cfg(all(target_os = "linux", feature = "io_uring")), so ubuntu +
  # --all-features is the only combination that compiles those files at all.
  #
  # Informational: it reports the link before it lands without adding a
  # merge-blocking context to the queue. Promote to required once it has run
  # green for a while.
  # ===========================================================================
  rustdoc-links:
    name: rustdoc links (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    env:
      RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          shared-key: ci-${{ runner.os }}-cargo-${{ env.CACHE_VERSION }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build rustdoc (workspace, all features, no deps)
        run: cargo doc --workspace --all-features --no-deps --locked

      # A SECOND question, not a duplicate of the step above. A link to an item
      # behind `#[cfg(feature = "...")]` RESOLVES under --all-features and is
      # unresolvable in a default build, where the item is not compiled at all -
      # so the all-features step is structurally unable to see that class. Five
      # such links (`fast_io::adaptive_dispatch` x4, `rsync_io::channel_adapter`)
      # were live on master while the step above was green.
      #
      # `crates/fast_io/src/io_uring` is cfg(all(target_os = "linux", feature =
      # "io_uring")), so this run deliberately does NOT cover those files; that
      # is what the all-features step is for. Neither subsumes the other.
      - name: Build rustdoc (workspace, default features, no deps)
        run: cargo doc --workspace --no-deps --locked

  # ===========================================================================
  # tools/ Unit Tests
  # ---------------------------------------------------------------------------
  # `tools/tests/` held unittest modules that no workflow ran, so a regression
  # in the helpers they cover was invisible - including the coverage gate and
  # the path-site sweep whose output scopes the confinement work. The runner
  # discovers by pattern rather than an enumerated list, because an enumerated
  # list is how those modules became orphans in the first place, and it asserts
  # a non-zero test count, because `unittest discover` exits 0 when it matches
  # nothing. Blocking, not informational: an inert gate is the defect it is
  # meant to catch.
  # ===========================================================================
  tools-tests:
    name: tools unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run tools/tests
        run: bash tools/ci/run_tools_tests.sh

  # ===========================================================================
  # Test Job - Full test suite on Linux with toolchain matrix
  # ===========================================================================
  test:
    name: nextest (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 120
    # Stable gates merge; beta/nightly are informational so a churning
    # nightly compiler does not block PR throughput. Branch protection
    # should pin the required check to `nextest (stable)`.
    continue-on-error: ${{ matrix.toolchain != 'stable' }}
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta, nightly]

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo apt-get remove -y '^dotnet-.*' '^llvm-.*' 'php.*' azure-cli google-chrome-stable \
            firefox powershell mono-devel libgl1-mesa-dri google-cloud-cli 2>/dev/null || true
          sudo apt-get autoremove -y 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (${{ matrix.toolchain }})
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          shared-key: ci-${{ runner.os }}-${{ matrix.toolchain }}-cargo-${{ env.CACHE_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          key: test

      - name: Install cargo-nextest
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2
        with:
          tool: cargo-nextest

      # See lint job comment above re: continue-on-error on cold rust-cache.
      - name: Regenerate Cargo.lock
        run: cargo update --workspace --offline
        continue-on-error: true

      - name: Run tests
        run: cargo nextest run --locked --profile ci --workspace --all-features

      - name: Set up SSH loopback
        if: matrix.toolchain == 'stable'
        run: |
          sudo systemctl start ssh
          mkdir -p ~/.ssh
          ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519 -N ""
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          ssh -o StrictHostKeyChecking=no localhost true

      - name: Run SSH integration tests
        if: matrix.toolchain == 'stable'
        continue-on-error: true
        run: cargo nextest run --locked --workspace --all-features --run-ignored ignored-only -E 'test(ssh)'

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-linux-${{ matrix.toolchain }}
          path: |
            target/debug/oc-rsync
            target/debug/xtask
          if-no-files-found: warn
          retention-days: 7

  # ===========================================================================
  # Feature Flags - Test various feature combinations (reusable workflow)
  # ===========================================================================
  feature-flags:
    name: Feature flag combinations
    needs: lint
    uses: ./.github/workflows/_test-features.yml
    with:
      cache_version: ${{ vars.CACHE_VERSION || 'v1' }}

  # ===========================================================================
  # Windows Test - Platform-specific testing with toolchain matrix
  # ===========================================================================
  windows-test:
    name: Windows (${{ matrix.toolchain }})
    runs-on: windows-latest
    needs: lint
    timeout-minutes: 45
    continue-on-error: ${{ matrix.toolchain != 'stable' }}
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta, nightly]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (${{ matrix.toolchain }})
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          shared-key: ci-windows-${{ matrix.toolchain }}-cargo-${{ env.CACHE_VERSION }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-nextest
        uses: ./.github/actions/install-cargo-nextest-windows

      # The steps below select individual packages, so Cargo never builds the
      # `oc-rsync` binary as a side effect the way a `--workspace` run does.
      # Integration tests that spawn the binary resolve exactly one path -
      # `<target>/<profile>/oc-rsync` - and abort when it is absent, so it has
      # to be built explicitly here. Default features match what the binary
      # ships with.
      - name: Build oc-rsync (for subprocess integration tests)
        run: cargo build --locked -p bin --bin oc-rsync

      - name: Test
        run: |
          # Run Windows-specific crates only (core, engine, cli have platform code)
          # Full test suite runs on Linux; Windows validates platform-specific paths
          cargo nextest run --locked -p core -p engine -p cli --all-features

      # Pin the Windows crtime (NTFS creation-time via SetFileTime), NTFS
      # sparse (FSCTL_SET_SPARSE) and IOCP read-parity tests on the required
      # Windows cell. These live in `metadata` (crtime) and `fast_io` (sparse,
      # IOCP) - crates the main Test step above does not run - so without this
      # step the Windows regression signal for those paths sits only in the
      # separate windows-acl-xattr / windows-iocp jobs. The filter matches the
      # crtime conversion and skip-flag tests, the mark_file_sparse probe, the
      # IOCP-vs-std read-path parity tests, and the network receiver's Windows
      # symlink materialization (directory link -> junction fallback, file link
      # -> skip-with-soft-error), which lives in `transfer` - another crate the
      # main Test step does not run.
      - name: Test crtime + sparse + iocp read parity + symlink junction (metadata, fast_io, transfer)
        shell: bash
        run: cargo nextest run --locked -p metadata -p fast_io -p transfer

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-windows-${{ matrix.toolchain }}
          path: |
            target/debug/oc-rsync.exe
            target/debug/xtask.exe
          if-no-files-found: warn
          retention-days: 7

  # ===========================================================================
  # Windows IOCP - Explicit `--features iocp` coverage (issue #1900)
  # ---------------------------------------------------------------------------
  # Default features already include `iocp` so the main `windows-test` job
  # exercises it implicitly. This job pins the feature explicitly to guarantee
  # beta-grade Windows confidence: the IOCP code path (PRs #1717-#1721) must
  # build and pass tests on its own without relying on other default features
  # masking regressions. Tests target `fast_io` (the crate that owns IOCP) and
  # `transfer` (the primary consumer of fast_io's async file I/O).
  # ===========================================================================
  windows-iocp:
    name: Windows IOCP (--features iocp)
    runs-on: windows-latest
    needs: lint
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          shared-key: ci-windows-iocp-cargo-${{ env.CACHE_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          key: windows-iocp

      - name: Install cargo-nextest
        uses: ./.github/actions/install-cargo-nextest-windows

      # Build the workspace with iocp explicitly enabled. The feature is in
      # defaults but pinning it here protects against future default changes
      # silently dropping iocp coverage from CI.
      - name: Build workspace (--features iocp)
        run: cargo build --locked --workspace --features iocp

      # Build fast_io with only iocp enabled (no other default features) so
      # the IOCP code path is verified in isolation.
      - name: Build fast_io (--no-default-features --features iocp)
        run: cargo build --locked -p fast_io --no-default-features --features iocp

      # Build fast_io with iocp plus the opt-in `transmitfile` feature. The
      # Windows `TransmitFile()` zero-copy file-to-socket primitive
      # (fast_io::iocp::transmit_file, WindowsTransmitFile) depends on `iocp`
      # but is not in the default feature set, so no other CI cell compiles
      # it. Pinning it here keeps the TransmitFile path building on
      # `windows-latest` instead of only ever compiling on a nightly run.
      - name: Build fast_io (--features iocp,transmitfile)
        run: cargo build --locked -p fast_io --features iocp,transmitfile

      # Run the iocp test suite. fast_io owns the IOCP modules; transfer
      # exercises the consumer side via fast_io's path dependency. The
      # `transmitfile` feature is enabled so the TransmitFile module's own
      # tests run alongside the core IOCP suite.
      - name: Test fast_io (--features iocp,transmitfile)
        run: cargo nextest run --locked -p fast_io --no-default-features --features iocp,transmitfile

      # transfer has no own iocp feature; it picks up iocp transitively
      # through fast_io's default features (which include iocp). Running with
      # `--all-features` here ensures the full transfer surface compiles and
      # passes against the iocp-enabled fast_io.
      - name: Test transfer (iocp via fast_io defaults)
        run: cargo nextest run --locked -p transfer --all-features

  # ===========================================================================
  # Windows ACL/xattr - Explicit ACL and xattr coverage (issue #1869)
  # ---------------------------------------------------------------------------
  # The main `windows-test` job runs only `core`, `engine`, `cli`, so the
  # `metadata` crate (which owns Windows ACL via Win32 GetSecurityInfo and
  # Windows xattr via NTFS Alternate Data Streams) is never exercised on
  # `windows-latest`. This job adds explicit coverage for those code paths so
  # master CI catches Windows ACL/ADS regressions.
  # ===========================================================================
  windows-acl-xattr:
    name: Windows ACL/xattr
    runs-on: windows-latest
    needs: lint
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          shared-key: ci-windows-acl-xattr-cargo-${{ env.CACHE_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          key: windows-acl-xattr

      - name: Install cargo-nextest
        uses: ./.github/actions/install-cargo-nextest-windows

      # Build metadata with ACL + xattr explicitly enabled so the Win32
      # GetSecurityInfo / SetSecurityInfo and ADS code paths are exercised.
      - name: Build metadata (--features acl,xattr)
        run: cargo build --locked -p metadata --features acl,xattr

      # Build oc-rsync.exe so the metadata integration tests that spawn the
      # binary as a subprocess (windows_ads_xattrs_roundtrip,
      # windows_symlink_junction_transfer) exercise the real transfer path
      # rather than skipping. Builds at the default debug profile to keep
      # the CI run fast; the integration tests probe target/debug first.
      # Tests that require admin privileges (e.g. `mklink /d` for directory
      # symlinks) still skip cleanly on the unelevated stock runner.
      - name: Build oc-rsync (for subprocess integration tests)
        run: cargo build --locked -p bin --bin oc-rsync

      # Run the full metadata test suite with both features enabled. This
      # covers acl_windows::tests (DACL round-trip), xattr_windows::tests
      # (NTFS Alternate Data Streams), and the end-to-end reparse-point
      # transfer tests in windows_symlink_junction_transfer.rs. Symlink
      # cases skip cleanly without `SeCreateSymbolicLinkPrivilege`; the
      # junction case runs unconditionally (`mklink /j` does not require
      # elevation on Windows 10+).
      - name: Test metadata (--features acl,xattr)
        run: cargo nextest run --locked -p metadata --features acl,xattr

      # Filtered workspace run that pins the ACL/ADS test sets in case future
      # tests land outside the metadata crate. Uses nextest expression syntax
      # to match `acl`, `xattr`, `ads`, and `stream` (NTFS ADS test names).
      # `shell: bash` is required so the single-quoted -E expression survives
      # without PowerShell-specific escaping.
      - name: Test ACL/xattr/ADS filter (workspace)
        shell: bash
        run: cargo nextest run --locked --workspace --features acl,xattr -E 'test(acl) | test(xattr) | test(ads) | test(stream)'

  # ===========================================================================
  # Windows daemon - Build and test the daemon crate at PR time.
  # ---------------------------------------------------------------------------
  # The main `windows-test` job runs only `core`, `engine`, `cli`, so the
  # `daemon` crate (which carries Windows-specific code in its TCP listener,
  # name converter, xfer-exec, and module-access paths) never builds on
  # `windows-latest` at PR time. Daemon Windows coverage lived only in the
  # nightly `windows-nightly-daemon.yml` schedule, so a Windows-only daemon
  # regression could merge and sit unnoticed until the next nightly run. This
  # job promotes that coverage to PR time so it is caught before merge.
  # ===========================================================================
  windows-daemon:
    name: Windows daemon
    runs-on: windows-latest
    needs: lint
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          shared-key: ci-windows-daemon-cargo-${{ env.CACHE_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          key: windows-daemon

      - name: Install cargo-nextest
        uses: ./.github/actions/install-cargo-nextest-windows

      # Build the daemon crate first so the nextest step links against an
      # already-warm build artifact. Default features only; the cross-OS
      # feature rows in _test-features.yml cover the async, tracing,
      # concurrent-sessions, and iconv variants.
      - name: Build daemon crate
        run: cargo build --locked -p daemon

      # Run the daemon-crate test suite on Windows so the Windows-gated
      # listener, name-converter, and xfer-exec paths are exercised at PR
      # time rather than only on the nightly schedule.
      - name: Test daemon crate
        run: cargo nextest run --locked -p daemon --no-fail-fast

  # ===========================================================================
  # Windows GNU Cross-Check - Validate x86_64-pc-windows-gnu compilation
  # ===========================================================================
  windows-gnu-cross-check:
    name: Windows GNU cross-check
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          targets: x86_64-pc-windows-gnu

      # Provide the x86_64-w64-mingw32-gcc C cross-compiler that the windows-gnu
      # build scripts of zstd-sys / libz-ng-sys invoke. The ubuntu-latest image
      # does not reliably ship it, so it has to be installed.
      #
      # The .deb set is cached rather than re-fetched, so the common path does
      # no network I/O at all and a transient apt-mirror failure cannot reach
      # it. This replaces a 5-attempt backoff loop: re-attempting a download
      # does not make a mirror healthy, it just spends up to 150s of runner
      # time before failing anyway. Same shape as the cargo-nextest install.
      - name: Restore mingw-w64 packages
        id: mingw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/mingw-w64-debs
          # The package set is pinned by the runner image, so the image label is
          # part of the key: a new image re-resolves the set instead of
          # installing stale .debs against a moved libc.
          key: mingw-w64-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-v1

      - name: Install mingw-w64
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          debs="$HOME/mingw-w64-debs"

          if command -v x86_64-w64-mingw32-gcc >/dev/null 2>&1; then
            echo "mingw-w64 already in the image: $(x86_64-w64-mingw32-gcc --version | head -1)"
            exit 0
          fi

          # Cold miss only: resolve and download the package set once. There is
          # no retry - a failure here fails the job immediately and loudly, with
          # the apt diagnostics needed to tell a mirror outage from a package
          # that has been renamed out from under us.
          if ! compgen -G "$debs/*.deb" >/dev/null; then
            # Empty apt's archive dir first so the copy below picks up only what
            # this install resolves, never leftovers from the image build - an
            # unrelated .deb swept into the cache would be dpkg -i'd on every
            # later hit.
            sudo apt-get clean
            if ! sudo apt-get update; then
              echo "apt-get update failed; mingw-w64 cannot be resolved" >&2
              apt-cache policy gcc-mingw-w64-x86-64 2>&1 | head -30 >&2 || true
              exit 1
            fi
            # gcc-mingw-w64-x86-64 is the small compiler package, not the large
            # mingw-w64 metapackage. --download-only pulls it AND its
            # dependencies, so the cached set is self-sufficient on a later hit.
            sudo apt-get install -y --no-install-recommends --download-only \
              gcc-mingw-w64-x86-64
            mkdir -p "$debs"
            sudo cp /var/cache/apt/archives/*.deb "$debs"/
            sudo chown -R "$(id -u):$(id -g)" "$debs"
          fi

          sudo dpkg -i "$debs"/*.deb

          # Verify the binary actually landed rather than trusting an exit code:
          # apt has reported success while leaving the compiler absent.
          if ! command -v x86_64-w64-mingw32-gcc >/dev/null 2>&1; then
            echo "install reported success but x86_64-w64-mingw32-gcc is missing" >&2
            exit 1
          fi
          x86_64-w64-mingw32-gcc --version | head -1

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          shared-key: ci-windows-gnu-cargo-${{ env.CACHE_VERSION }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Check compilation
        run: cargo check --locked --workspace --target x86_64-pc-windows-gnu

  # ===========================================================================
  # macOS Test - Platform-specific testing with toolchain matrix
  # ===========================================================================
  macos-test:
    name: macOS (${{ matrix.toolchain }})
    runs-on: macos-latest
    needs: lint
    timeout-minutes: 30
    continue-on-error: ${{ matrix.toolchain != 'stable' }}
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta, nightly]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (${{ matrix.toolchain }})
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          shared-key: ci-macos-${{ matrix.toolchain }}-cargo-${{ env.CACHE_VERSION }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2
        with:
          tool: cargo-nextest

      # `core`, `engine`, `cli` and `metadata` all own tests that spawn the
      # `oc-rsync` binary, and a package-scoped run never builds it. See the
      # note on the Windows job above.
      - name: Build oc-rsync (for subprocess integration tests)
        run: rustup run ${{ matrix.toolchain }} cargo build --locked -p bin --bin oc-rsync

      # Invoke through `rustup run` to bypass the cargo proxy shim, which on
      # macOS GitHub runners can resolve to rustup-init directly and fail with
      # `error: unexpected argument 'build' found` when rust-toolchain.toml
      # pins a toolchain that was not pre-installed.
      - name: Test
        run: |
          # Run macOS-specific crates only (core, engine, cli have platform code).
          # Full test suite runs on Linux; macOS validates platform-specific paths.
          # metadata covers the Darwin acl_exacl branch and the macOS timestamp
          # path in crates/metadata/src/apply/timestamps.rs. apple-fs covers the
          # AppleDouble round-trip plus the macOS-only resource fork pipeline.
          # Tests that need root self-skip via geteuid() (see acl_handling.rs)
          # and the resource-fork test probes xattr support and skips on
          # filesystems that do not support it (e.g. FAT-mounted /tmp).
          #
          # fast_io was missing from this list, which is the worst possible
          # omission: it is the crate whose entire purpose is platform-specific
          # I/O, so its Linux-vs-fallback branches are exactly what a macOS cell
          # exists to exercise. Three dir_sandbox tests asserted the
          # openat2/RESOLVE_BENEATH branch unconditionally and were red on
          # macOS while every required check stayed green, because no cell ran
          # the crate off Linux. Measured on master before adding it: 665 tests,
          # 662 passed, 3 failed - the whole cost of closing the hole.
          rustup run ${{ matrix.toolchain }} cargo nextest run --locked -p core -p engine -p cli -p metadata -p apple-fs -p fast_io --all-features

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-macos-${{ matrix.toolchain }}
          path: |
            target/debug/oc-rsync
            target/debug/xtask
          if-no-files-found: warn
          retention-days: 7

  # ===========================================================================
  # Linux musl Test - Static musl binary build and test with toolchain matrix
  # ===========================================================================
  linux-musl:
    name: Linux musl (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30
    continue-on-error: ${{ matrix.toolchain != 'stable' }}
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta, nightly]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          df -h /

      # Pre-warm the toolchain download with a short-timeout retry loop so a
      # transient rustup fetch failure (DNS hang or TCP connect timeout to the
      # static.rust-lang.org CDN edge) self-heals fast instead of failing the
      # job. Each attempt is wall-clock capped so a hung connect is killed and
      # retried rather than eating the job budget. dtolnay/rust-toolchain below
      # then hits the local cache. 2 retries is plenty; more is wasted time.
      - name: Pre-install toolchain (short-timeout retry on transient fetch)
        run: |
          for attempt in 1 2 3; do
            if timeout 90 rustup toolchain install "${{ matrix.toolchain }}" \
                --profile minimal --no-self-update \
                --target x86_64-unknown-linux-musl; then
              exit 0
            fi
            echo "::warning::rustup toolchain install attempt ${attempt}/3 failed or timed out; retrying"
            sleep 5
          done
          echo "::error::rustup toolchain install failed after 2 retries"
          exit 1

      - name: Install Rust (${{ matrix.toolchain }})
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: x86_64-unknown-linux-musl

      - name: Ensure musl target on active toolchain
        run: rustup target add x86_64-unknown-linux-musl

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          shared-key: ci-musl-x86_64-${{ matrix.toolchain }}-cargo-${{ env.CACHE_VERSION }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2
        with:
          tool: cargo-nextest

      - name: Build
        run: cargo build --locked --workspace --target x86_64-unknown-linux-musl --no-default-features --features "zstd,lz4,xattr,iconv,parallel,copy_file_range"

      - name: Test
        run: cargo nextest run --locked --workspace --target x86_64-unknown-linux-musl --no-default-features --features "zstd,lz4,xattr,iconv,parallel,copy_file_range"

      - name: Verify static linking
        run: |
          set -euo pipefail
          BINARY="target/x86_64-unknown-linux-musl/debug/oc-rsync"
          if [ -f "${BINARY}" ]; then
            file "${BINARY}"
            if ldd "${BINARY}" 2>&1 | grep -q "not a dynamic executable"; then
              printf 'Binary is statically linked\n'
            else
              printf 'Warning: binary may not be fully statically linked\n'
              ldd "${BINARY}" || true
            fi
          fi

  # ===========================================================================
  # Interop Tests - Compatibility with upstream rsync (reusable workflow)
  # ===========================================================================
  interop-upstream:
    name: interop
    needs: lint
    uses: ./.github/workflows/_interop.yml
    with:
      cache_version: ${{ vars.CACHE_VERSION || 'v1' }}
      upstream_rsync_version: ${{ vars.UPSTREAM_RSYNC_VERSION || '3.4.4' }}
      timeout_minutes: 30

  # ===========================================================================
  # macOS Interop - Smoke parity with Homebrew upstream rsync (audit G5)
  # ---------------------------------------------------------------------------
  # Required check. Runs the portable harness in
  # `tools/ci/run_interop_smoke.sh` against `brew install rsync`. Skips
  # Linux-only scenarios (xattr/ACL/daemon/SSH loopback); those stay in
  # `interop-upstream`.
  # ===========================================================================
  interop-upstream-macos:
    name: interop (macOS)
    needs: lint
    uses: ./.github/workflows/_interop-macos.yml
    with:
      cache_version: ${{ vars.CACHE_VERSION || 'v1' }}
      timeout_minutes: 25

  # ===========================================================================
  # Windows Interop - Best-effort smoke parity with MSYS2 rsync (audit G5)
  # ---------------------------------------------------------------------------
  # Non-required check (the reusable workflow sets `continue-on-error:
  # true`). Validates the Windows oc-rsync.exe binary against the
  # MSYS2/Cygwin upstream rsync for the basic push/pull/delta scenarios.
  # Promote to required once baseline parity is green on master.
  # ===========================================================================
  interop-upstream-windows:
    name: interop (Windows, best-effort)
    needs: lint
    uses: ./.github/workflows/_interop-windows.yml
    with:
      cache_version: ${{ vars.CACHE_VERSION || 'v1' }}
      timeout_minutes: 30

  # ===========================================================================
  # Upstream Testsuite - Drive upstream rsync's own testsuite corpus against
  # oc-rsync (reusable workflow)
  # ---------------------------------------------------------------------------
  # Required check. Pinned to 3.5.0, the release this project targets. The
  # driver dispatches on the extracted tree's SHAPE, not its version string:
  # 3.5.0 ships runtests.py + 345 `*_test.py` and takes upstream's own runner,
  # where 3.4.4 shipped 57 `*.test` shell scripts. That matters because the
  # behavioural axis is what 3.5.0 changed (33 CVEs, a rewritten path resolver,
  # new options and daemon directives) - the wire format did not move, so the
  # interop cells above cannot see any of it.
  #
  # The harness exits non-zero on UNEXPECTED failures or UNEXPECTED passes;
  # both surface regressions worth blocking on.
  # ===========================================================================
  upstream-testsuite:
    needs: lint
    uses: ./.github/workflows/_upstream-testsuite.yml
    with:
      cache_version: ${{ vars.CACHE_VERSION || 'v1' }}
      # Its OWN variable, deliberately not the interop job's
      # `UPSTREAM_RSYNC_VERSION`. The two now want different versions - interop
      # sweeps a multi-version matrix from run_interop.sh, this gate pins the
      # single release we conform to - so sharing one knob would let an
      # operator override drag the conformance gate back to 3.4.4 as a side
      # effect of retargeting interop.
      upstream_rsync_version: ${{ vars.UPSTREAM_TESTSUITE_VERSION || '3.5.0' }}
      # The accepted-divergence ledger, GENERATED from run 32260924822 and
      # committed. --expect-result runs ONLY these tests and fails on any
      # mismatch INCLUDING an unexpected PASS, so a test that starts passing
      # reddens the gate until the baseline is regenerated - the divergence
      # set can only shrink deliberately, never drift.
      expect_result_nonroot: tools/ci/upstream-3.5.0-expect.nonroot.txt
      expect_result_root: tools/ci/upstream-3.5.0-expect.root.txt

  # ===========================================================================
  # Upstream Testsuite over a real loopback TCP daemon
  # ---------------------------------------------------------------------------
  # The same 3.5.0 corpus as the job above, run with `transport: tcp`. The two
  # transports are NOT redundant: the job above uses upstream's secure default,
  # a stdio socketpair with no listening socket, so it never exercises accept(),
  # the `hosts allow`/`hosts deny` decision, or the peer-address resolution that
  # only a real bound socket can reach. Those are exactly the surfaces the 3.5.0
  # daemon CVEs live on, so a pipe-only gate cannot see a regression in them.
  #
  # `tcp` also passes --daemon-tests-only, which is the pairing upstream ships
  # the option for - the dropped tests never call start_test_daemon(), so they
  # cannot observe --use-tcp and would only repeat the pipe leg. That is why
  # this leg runs 155 tests, not 345, and why it carries its OWN manifests
  # rather than reusing the pipe ones.
  #
  # Reported as `upstream-testsuite-tcp / upstream testsuite` and
  # `... / upstream testsuite (root)` - the job id below supplies the prefix
  # that distinguishes them from the pipe leg, which is why the reusable
  # workflow's own job names are literals rather than expressions.
  #
  # Not yet a required status check: registering a context in branch protection
  # is a repo-admin action. Until that happens these run and report on every PR
  # but do not block, so a regression is visible rather than silently unmeasured
  # - which is the state this replaces, where the TCP legs ran only on
  # workflow_dispatch and cron and no pull request ever validated them.
  # ===========================================================================
  upstream-testsuite-tcp:
    needs: lint
    uses: ./.github/workflows/_upstream-testsuite.yml
    with:
      cache_version: ${{ vars.CACHE_VERSION || 'v1' }}
      upstream_rsync_version: ${{ vars.UPSTREAM_TESTSUITE_VERSION || '3.5.0' }}
      transport: 'tcp'
      # Separate from the pipe manifests by measurement, not by convention: the
      # tcp legs select a different (smaller) test set, so a shared file would
      # fail the driver's own coverage guard.
      expect_result_nonroot: tools/ci/upstream-3.5.0-expect.nonroot.tcp.txt
      expect_result_root: tools/ci/upstream-3.5.0-expect.root.tcp.txt

  # ===========================================================================
  # Upstream testsuite - macOS (3.5.0, nonroot/pipe)
  # ---------------------------------------------------------------------------
  # The four Linux legs ({nonroot,root} x {pipe,tcp}) cannot observe a
  # platform-conditional divergence. Counted from the committed manifest: this
  # leg carries 3 expected failures, and only ONE
  # (filter-merge-content-echo) is shared with the Linux nonroot/pipe leg. The
  # other TWO are divergences no existing context sees - chmod-setid passes on
  # Linux, and partial-protected-regular-retry-policy SKIPS there, so it had
  # never executed in CI at all.
  #
  # Uses its own reusable workflow rather than a `runs-on` input on
  # `_upstream-testsuite.yml`; the reasoning is in that file's header. The
  # platform-agnostic half - `tools/ci/run_upstream_testsuite.sh` - IS shared.
  #
  # Not yet a required status check: registering a context in branch protection
  # is a repo-admin action. The manifest makes it non-vacuous from the first
  # run regardless - it records those failures as EXPECTED, so the gate fires
  # on drift, exactly as the Linux legs do with their own `fail` rows.
  # ===========================================================================
  upstream-testsuite-macos:
    needs: lint
    uses: ./.github/workflows/_upstream-testsuite-macos.yml
    with:
      cache_version: ${{ vars.CACHE_VERSION || 'v1' }}
      upstream_rsync_version: ${{ vars.UPSTREAM_TESTSUITE_VERSION || '3.5.0' }}

  # ===========================================================================
  # DG-3.e: concurrent_register_and_dispatch stress (#2694)
  # ---------------------------------------------------------------------------
  # Runs the 1000-thread x 10K-iter stress in
  # `crates/engine/tests/parallel_apply_dg3_stress.rs` on Linux + Windows +
  # macOS to validate the DG-3 SlotData/BarrierState split fixes the
  # `finish_file` Arc::try_unwrap release race that previously needed the
  # spin-then-yield workaround. Non-required so a flake (e.g. CI runner
  # thread-limit pressure) does not block merges; surfaces regressions in
  # the post-DG-3 applier under fan-out load that the standard nextest cell
  # would never reach with its smaller per-test thread budgets.
  # ===========================================================================
  dg3-stress:
    name: DG-3 stress (${{ matrix.os }}, non-required)
    needs: lint
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          shared-key: ci-dg3-stress-${{ runner.os }}-cargo-${{ env.CACHE_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          key: dg3-stress

      - name: Install cargo-nextest (Unix)
        if: runner.os != 'Windows'
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2
        with:
          tool: cargo-nextest

      - name: Install cargo-nextest (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/install-cargo-nextest-windows

      # Build the engine crate with the `dg-stress` feature so the stress
      # test under `#[cfg(feature = "dg-stress")]` is compiled in.
      - name: Build engine (--features dg-stress)
        run: cargo build --locked -p engine --tests --features dg-stress

      # `engine` owns a test that spawns the `oc-rsync` binary. It is filtered
      # out of the run below today, but a package-scoped selection never builds
      # the binary, so build it here rather than leaving the cell one filter
      # edit away from a hard failure. See the note on the Windows job above.
      - name: Build oc-rsync (for subprocess integration tests)
        run: cargo build --locked -p bin --bin oc-rsync

      # Run only the stress test. `--no-tests=pass` keeps the cell green if
      # the test ever gets renamed or moved (the filter would match zero
      # tests). 1000 threads x 10K iter = 10M cycles; in-memory sinks make
      # the per-iter cost a few atomic adds plus the applier's mutex path.
      - name: Run DG-3 stress (--features dg-stress)
        run: cargo nextest run --locked -p engine --features dg-stress --no-tests=pass -E 'test(concurrent_register_and_dispatch_stress)'
