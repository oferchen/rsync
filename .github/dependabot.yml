version: 2

updates:
  # Rust dependencies. The root workspace and the three cargo-fuzz
  # workspaces each carry their own Cargo.lock, so all four directories
  # are listed here to keep every lockfile in step on a shared-dep bump
  # (the fuzz workspaces are excluded from the root workspace). The groups
  # below apply across every directory, so one shared bump updates all
  # four lockfiles in a single PR.
  - package-ecosystem: "cargo"
    directories:
      - "/"
      - "/fuzz"
      - "/crates/protocol/fuzz"
      - "/crates/filters/fuzz"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
    ignore:
      # serial_test 4.x raises its MSRV to rustc 1.93.1; this workspace pins
      # Rust 1.88.0 (rust-toolchain.toml), so its major bumps are not takeable
      # without a toolchain upgrade. Hold at 3.x until the pinned toolchain moves.
      - dependency-name: "serial_test"
        update-types: ["version-update:semver-major"]
      - dependency-name: "serial_test_derive"
        update-types: ["version-update:semver-major"]
    groups:
      # RustCrypto trait family must move together: md4/sha1/sha2 internally
      # depend on a specific digest version range, and cargo_metadata's
      # cargo-platform transitive bumps the MSRV. Group across all update
      # types (including major) to keep coupled crates aligned in one PR.
      rustcrypto:
        patterns:
          - "digest"
          - "md-5"
          - "md4"
          - "sha1"
          - "sha2"
          - "blake2"
          - "blake3"
        update-types:
          - "major"
          - "minor"
          - "patch"
      cargo-metadata:
        patterns:
          - "cargo_metadata"
          - "cargo-platform"
        update-types:
          - "major"
          - "minor"
          - "patch"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "ci"
    groups:
      actions:
        patterns:
          - "*"
