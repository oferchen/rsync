name: Free disk space
description: >-
  Remove the preinstalled toolchains the build never uses. When the runner
  already has min-free-gb or more free on /, the directory removal runs in the
  background so the job does not wait for it; below that it runs in full first.

inputs:
  min-free-gb:
    description: Free space on / below which the job waits for a full cleanup.
    default: '40'
  remove-packages:
    description: Also apt-remove the large unused package groups when cleaning in full.
    default: 'false'

runs:
  using: composite
  steps:
    - name: Free disk space
      shell: bash
      env:
        MIN_FREE_GB: ${{ inputs.min-free-gb }}
        REMOVE_PACKAGES: ${{ inputs.remove-packages }}
      run: |
        set -euo pipefail
        free_gb() { df --output=avail -BG / | tail -1 | tr -dc '0-9'; }
        remove_dirs() {
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
        }
        before=$(free_gb)
        if [ "$before" -ge "$MIN_FREE_GB" ]; then
          # Directory removal only: apt and docker take locks that later steps
          # (apt-get install, cross) would contend for.
          echo "free on /: ${before}G >= ${MIN_FREE_GB}G; removing unused toolchains in the background"
          export -f remove_dirs
          nohup setsid bash -c remove_dirs > "$RUNNER_TEMP/free-disk-space.log" 2>&1 &
          exit 0
        fi
        echo "free on /: ${before}G < ${MIN_FREE_GB}G; cleaning before the build"
        remove_dirs
        if [ "$REMOVE_PACKAGES" = true ]; then
          sudo apt-get remove -y '^dotnet-.*' '^llvm-.*' 'php.*' azure-cli google-chrome-stable \
            firefox powershell mono-devel libgl1-mesa-dri google-cloud-cli 2>/dev/null || true
          sudo apt-get autoremove -y 2>/dev/null || true
        fi
        sudo docker image prune --all --force || true
        sudo apt-get clean || true
        df -h /
