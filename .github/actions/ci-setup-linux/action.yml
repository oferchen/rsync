name: CI Setup (Linux)
description: Checkout, optional disk cleanup, Rust toolchain, rust-cache, and optional nextest/apt/openssh setup.
inputs:
  toolchain:
    description: Rust toolchain name
    required: false
    default: stable
  components:
    description: Comma-separated rustup components
    required: false
    default: ''
  targets:
    description: Comma-separated rustup targets
    required: false
    default: ''
  cache_prefix:
    description: Swatinem/rust-cache prefix-key
    required: false
    default: linux
  cache_version:
    description: Cache version suffix
    required: false
    default: v1
  free_disk:
    description: Run free-disk-space before checkout/build
    required: false
    default: 'false'
  install_nextest:
    description: Install cargo-nextest via taiki-e/install-action
    required: false
    default: 'false'
  apt_packages:
    description: Space-separated apt packages to install via tools/ci/ensure_apt_packages.sh
    required: false
    default: ''
  build_openssh:
    description: Build pinned OpenSSH (ssh_config oracle)
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Free runner disk space if short
      if: inputs.free_disk == 'true'
      uses: ./.github/actions/free-disk-space

    - name: Install Rust
      uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    - name: Rust cache
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
      with:
        prefix-key: ${{ inputs.cache_prefix }}-${{ inputs.toolchain }}-${{ inputs.cache_version }}

    - name: Install apt packages
      if: inputs.apt_packages != ''
      shell: bash
      run: bash tools/ci/ensure_apt_packages.sh ${{ inputs.apt_packages }}

    - name: Install cargo-nextest
      if: inputs.install_nextest == 'true'
      uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2
      with:
        tool: cargo-nextest

    - name: Build pinned OpenSSH (ssh_config oracle)
      if: inputs.build_openssh == 'true'
      uses: ./.github/actions/build-openssh
