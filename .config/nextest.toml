# Nextest defaults: keep full workspace filter while relying on CLI flags for package selection.
#
# Flaky visibility: `status-level = "retry"` prints every failed attempt as it
# happens, and `final-status-level = "flaky"` lists each retried-then-passed
# test after the summary, so a retry is counted instead of reported as a plain
# pass. CI greps those FLAKY lines into the step summary via
# tools/ci/nextest_flaky_summary.sh.
[profile.default]
default-filter = "all()"
status-level = "retry"
final-status-level = "flaky"
failure-output = "immediate-final"
# Per-test timeout, mirroring profile.ci. Without `terminate-after` nextest's
# default is to warn about a slow test forever and never terminate it, so a
# wedged daemon test hangs until the whole run is killed by hand. Measured with
# nextest 0.9.105: a test blocked with the daemon's signal handlers installed
# sat at "has been running for over 60 seconds" indefinitely under a
# `slow-timeout`-less profile, and was only removed when nextest itself was
# signalled. That matters here and not only in CI, because the Windows and
# macOS nextest cells run this profile rather than profile.ci, and because a
# local run that is killed with SIGKILL (the documented `pkill -9 -f cargo`
# remedy) orphans every test process nextest had not yet reaped, which then
# accumulate against `ulimit -u`.
#
# This bounds a wedged *test process*. It does not reach the separate leak of
# detached daemon children a `-p daemon` run leaves at PPID 1: those are not the
# process nextest spawned, so no timeout here can see them. That population is
# the `spawn_daemon_pending_no_detach` migration tracked by
# `tools/ci/check_daemon_no_detach.sh`.
slow-timeout = { period = "120s", terminate-after = 3 }

[profile.ci]
default-filter = "all()"
status-level = "retry"
final-status-level = "flaky"
failure-output = "immediate-final"
success-output = "never"
# Per-test timeout: fail individual tests that hang rather than hitting CI job timeout.
slow-timeout = { period = "120s", terminate-after = 3 }
# Generate JUnit XML for CI dashboards (optional, not currently used)
# junit.path = "junit.xml"

# Retry policies for tests with inherent environmental races. The original
# file-based port allocator TOCTOU was root-caused and fixed in the same
# change that introduced this policy (OS-assigned ephemeral ports plus a held
# listener); what remains is the irreducible drop-listener-then-daemon-rebind
# window, plus accept/handshake stalls on loaded runners, which the bounded
# client stream timeouts convert into fast failures for these retries to
# absorb. Every absorbed pass is reported as FLAKY, never as a plain pass.
[[profile.ci.overrides]]
filter = "package(daemon) | test(execute_sparse) | binary_id(~integration_daemon)"
retries = 2

# Retry policies for tests with inherent race conditions (port binding TOCTOU,
# slow CI runner timing, transient Windows %TEMP% "Access is denied" on
# NamedTempFile creation). Mirrors profile.ci so the Windows nextest cells -
# which run under the default profile, not profile.ci - also retry these.
[[profile.default.overrides]]
filter = "package(daemon) | test(execute_sparse) | binary_id(~integration_daemon)"
retries = 2

# Daemon-spawn negotiation tests each start a real daemon thread and drive it
# over a loopback TCP connection. Under heavy concurrent execution on Windows CI
# runners the accept/handshake path can stall, leaving a client blocked long
# enough to trip the 360s slow-timeout (observed as a job-level hang). The
# client streams now carry a bounded read/write timeout so such a stall fails
# fast and the package-wide retries above absorb it; serialising these tests in
# a single-threaded group further removes cross-binary accept contention as a
# trigger. Mirrored into profile.default so the Windows nextest cells (default
# profile) get the same grouping.
[[profile.ci.overrides]]
filter = "package(daemon) & (test(daemon_negotiation) | test(daemon_protocol_28_forced) | test(run_daemon_records_log_file_entries))"
test-group = "daemon-spawn-serial"

[[profile.default.overrides]]
filter = "package(daemon) & (test(daemon_negotiation) | test(daemon_protocol_28_forced) | test(run_daemon_records_log_file_entries))"
test-group = "daemon-spawn-serial"

# The daemon `--relative` name cells each spawn their own daemon and drive it
# over loopback. Measured on macOS under saturating CPU load: the 3-cell form of
# this binary failed 0/8 runs, the 8-cell form 2/8, and the SAME 8 cells forced
# single-threaded failed 0/8 - so the trigger is concurrent spawn/accept, not
# any one cell. The client sees the daemon reset the connection while reading
# the greeting. Same mechanism, and same remedy, as the daemon-package cells
# grouped above.
[[profile.ci.overrides]]
filter = "package(transfer) & binary(daemon_pull_relative_names_are_module_relative)"
test-group = "daemon-spawn-serial"

[[profile.default.overrides]]
filter = "package(transfer) & binary(daemon_pull_relative_names_are_module_relative)"
test-group = "daemon-spawn-serial"

[test-groups.daemon-spawn-serial]
max-threads = 1

# SSH integration tests must run serially - parallel SSH sessions on the CI
# runner caused pipe corruption (garbled data, zero-length filenames, broken
# connections); the serialisation below is the fix. This group deliberately
# carries no retries: the real loopback tests are #[ignore] and run only in a
# non-blocking CI step, so the filter otherwise matches deterministic unit
# tests where a retry would only mask a regression.
[[profile.default.overrides]]
filter = "test(test_ssh)"
test-group = "ssh-serial"

[test-groups.ssh-serial]
max-threads = 1

# Buffer pool global singleton tests share a process-wide OnceLock.
# Parallel execution causes init_global_buffer_pool to see already-initialized
# state from another test, leading to non-deterministic failures.
# Env var tests mutate OC_RSYNC_BUFFER_POOL_SIZE and must not run concurrently.
[[profile.default.overrides]]
filter = "test(global_pool) | test(env_var)"
test-group = "global-pool-serial"

[test-groups.global-pool-serial]
max-threads = 1

# Spill-policy env-var tests mutate OC_RSYNC_SPILL_* and must not run
# concurrently with other tests reading the same process-wide state.
[[profile.default.overrides]]
filter = "test(env_spill) | test(from_env)"
test-group = "spill-env-serial"

[test-groups.spill-env-serial]
max-threads = 1
