# Example oc-rsyncd configuration matching the default install at
# /etc/oc-rsync/oc-rsyncd.conf. Copy this file into place and adjust values
# to suit your environment. See oc-rsyncd.conf(5) for detailed documentation of
# every directive.
#
# The daemon mirrors upstream rsyncd.conf semantics. Uncomment and adjust the
# directives below to enable modules. By default no modules are exported.
# Secrets belong in /etc/oc-rsync/oc-rsyncd.secrets with permissions 0600.

# Global settings
# uid = nobody
# gid = nogroup
# max connections = 4
# timeout = 600

# Example module definition
# [data]
#     path = /srv/rsync/data
#     comment = Public data mirror
#     use chroot = no
#     read only = yes
#     list = yes
#     auth users = backup
#     secrets file = /etc/oc-rsync/oc-rsyncd.secrets
#     # Minimum challenge-response digest accepted for this module,
#     # strongest first: sha512, sha256, sha1, md5, md4. Unset means no
#     # minimum. A client that advertises no digest list - any rsync
#     # before 3.2.0 - makes the daemon fall back to md5 (md4 below
#     # protocol 30), and an on-path attacker can rewrite the
#     # unauthenticated negotiation to force the same weak choice; a
#     # captured challenge-response is then cheap to brute-force
#     # offline. Set this if all your clients are modern. The
#     # connection is refused before the challenge is sent.
#     auth digest = sha256
#     hosts allow = 192.0.2.0/24,2001:db8::/32
#     refuse options = delete
